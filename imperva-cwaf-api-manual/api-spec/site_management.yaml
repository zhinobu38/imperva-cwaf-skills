  /api/prov/v1/sites/add:
    post:
      tags:
      - Site Management
      summary: Add a site
      description: Add a new site to an account. If the site already exists, its status
        is returned.
      operationId: addSite
      parameters:
      - name: domain
        in: query
        description: 'The domain name of the site. For example: <a href="www.example.com">www.example.com</a>,
          <a href="hello.example.com">www.example.com</a>, <a href="example.com">www.example.com</a>'
        required: true
        schema:
          type: string
        example: example.imperva.com
      - name: account_id
        in: query
        description: Numeric identifier of the account to operate on.<br/>If not specified,
          operation will be performed on the account identified by the authentication
          parameters.
        schema:
          type: string
        example: 10
      - name: ref_id
        in: query
        description: Customer specific identifier for this operation
        schema:
          type: string
        example: 11
      - name: send_site_setup_emails
        in: query
        description: If this value is false, end users will not get emails about the
          add site process such as DNS instructions and SSL setup.
        schema:
          type: string
        example: false
      - name: site_ip
        in: query
        description: Manually set the web server IP/CNAME
        schema:
          type: string
        example: 1.2.3.4
      - name: force_ssl
        in: query
        description: If this value is true, manually set the site to support SSL.<br/>This
          option is only available for sites with manually configured IP/CNAME and
          for specific accounts.
        schema:
          type: string
        example: true
      - name: naked_domain_san
        in: query
        description: "Use \u201Ctrue\u201D to add the naked domain SAN to a www site\u2019\
          s SSL certificate. Default value: true"
        schema:
          type: string
        example: true
      - name: wildcard_san
        in: query
        description: "Use \u201Ctrue\u201D to add the wildcard SAN or \u201Cfalse\u201D\
          \ to add the full domain SAN to the site\u2019s SSL certificate. Default\
          \ value: true"
        schema:
          type: string
        example: true
      - name: log_level
        in: query
        description: "Available only for customers that purchased the Logs Integration\
          \ SKU.<br/>Sets the log reporting level for the site. Options are \u201C\
          full\u201D, \u201Csecurity\u201D, \u201Cnone\u201D and default"
        schema:
          type: string
        example: full
      - name: logs_account_id
        in: query
        description: Available only for customers that purchased the Logs Integration
          SKU.<br/>Numeric identifier of the account that purchased the logs integration
          SKU and which collects the logs.<br/>If not specified, operation will be
          performed on the account identified by the authentication parameters
        schema:
          type: string
        example: 10
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: res - contains the specific error code:<br/>3001 - Domain invalid<br/>3002
            - Site is on the CloudFlare network<br/>3003 - Site requires SSL<br/>3004
            - Domain belongs to a known service</br>3005 - Site is on a service<br/>3006
            - Site requires multiple IPs support<br/>3011 - Site unresolvable<br/>3012
            - Site unreachable<br/>3013 -Site already protected by the service<br/>3014
            - Number of allowed sites exceeded.<br/>3015 - Internal error
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiResultSiteStatus'
                - $ref: '#/components/schemas/ApiResult'
