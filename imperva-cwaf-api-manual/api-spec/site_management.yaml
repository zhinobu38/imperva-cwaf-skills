                $ref: '#/components/schemas/ApiResult'
  /api/prov/v1/sites/status:
    post:
      tags:
      - Site Management
      summary: Get site status
      description: Use this operation to get the status of a site.
      operationId: siteStatus
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on
        required: true
        schema:
          type: string
        example: 10
      - name: tests
        in: query
        description: 'List of tests to run on site before returning its status.<br/>A
          comma separated list of one of: domain_validation, services, dns<br/>Values
          for the stats parameters:<br/><ul><li><b>domain_validation</b> Runs the
          domain validation test on the specified site. This test will check for HTML
          meta tag or DNS records, according to the selected domain validation method.</li><li><b>services</b>
          Runs the services test on the specified site. This test will check the availability
          of HTTP and HTTPS connections on the site.</li><li><b>dns</b> Runs the DNS
          test on the specified site. This test will check whether the site owner
          performed the DNS changes required in order to protect the site.</li></ul>'
        schema:
          type: string
        example: domain_validation
      responses:
        '200':
          description: res - contains the specific error code:<br/>3001 - Domain invalid<br/>6002
            - Invalid configuration parameter value<br/>9415 - Operation not allowed
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiResultSiteStatus'
                - $ref: '#/components/schemas/ApiResult'
