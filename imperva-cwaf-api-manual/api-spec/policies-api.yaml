            format: int64
            description: Set of asset IDs that this policy assigned to.
        defaultPolicyConfig:
          type: array
          description: "Sets the specified policy as default for the account, or indicates\
            \ that the policy is set as default. A default policy is used by any new\
            \ website added to the account."
          items:
            $ref: '#/components/schemas/DefaultPolicyConfigDto'
        description:
          type: string
          description: The Policy description
          example: This is policy blocks all requests from Europe
        enabled:
          type: boolean
          description: "Enable or disable the policy. A WAF Rules policy is always\
            \ created in the enabled state, and cannot be disabled."
        name:
          type: string
          description: The Policy name
          example: Block ip Policy
        policySettings:
          type: array
          items:
            $ref: '#/components/schemas/PolicySettingsDto'
        policyType:
          type: string
          description: The Policy type
          enum:
          - ACL
          - WHITELIST
          - WAF_RULES
          - FILE_UPLOAD
        subaccountIds:
          type: array
          description: set of subaccount IDs that allowed to use this policy.
          items:
            type: object
            description: set of subaccount IDs that allowed to use this policy.
      required:
      - enabled
      - name
      - policyType
    PolicyResult:
      type: object
      properties:
        isError:
          type: boolean
          description: States if an error has occurred
          example: false
        value:
          type: object
    PolicySettingsDto:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SettingsDataDto'
        id:
          type: integer
          format: int64
          description: The Policy Settings ID
          example: 10
        policyDataExceptions:
          type: array
          description: The exception configuration on a given settings
          items:
            $ref: '#/components/schemas/PolicyDataExceptionDto'
        policyId:
          type: integer
          format: int64
          description: The Policy ID of this setting
          example: 10
        policySettingType:
          type: string
          description: The PolicySettings type
          enum:
          - GEO
          - URL
          - IP
          - HEADER_VALUE
          - CROSS_SITE_SCRIPTING
          - ILLEGAL_RESOURCE_ACCESS
          - REMOTE_FILE_INCLUSION
          - SQL_INJECTION
          - RESP_DATA_LEAK
          - MALICIOUS_FILE_UPLOAD
          - "IP,GEO,URL,CROSS_SITE_SCRIPTING,ILLEGAL_RESOURCE_ACCESS,REMOTE_FILE_INCLUSION,SQL_INJECTION,RESP_DATA_LEAK,MALICIOUS_FILE_UPLOAD"
          example: IP/GEO/URL
        settingsAction:
          type: string
          description: The action taken by Imperva when a policy rule is triggered
          enum:
          - BLOCK
          - ALLOW
          - ALERT
          - BLOCK_USER
          - BLOCK_IP
          - IGNORE
          - HIDDEN_ALERT
          - MASK
          example: BLOCK
