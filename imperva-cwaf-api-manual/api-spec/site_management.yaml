  /api/prov/v1/sites/cache/purge:
    post:
      tags:
      - Site Management
      summary: Purge site cache
      description: Use this operation to purge all cached content on our proxy servers
        for a specific site.<br/>Our Proxy servers keep cached content of your sites
        in order to accelerate page load times for your users.<br/>When you want this
        cached content to be refreshed (for example, after making adjustments in your
        site) you can use this API call.<br/>In order to purge the entire cached content
        for this site just use the API call with no parameters.<br/>If you want to
        purge a specific resource add the resource name as parameter.
      operationId: purgeSiteCache
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on.
        required: true
        schema:
          type: integer
          format: int64
        example: 10
      - name: purge_pattern
        in: query
        description: The pattern of the resource to be purged from the cache. For
          example:</br><ul/><li><b>Resource_name</b> - Resources that contain Resource_name
          will be purged</li><li><b>^Resource_name</b> - Resources that start with
          Resource_name will be purged</li><li><b>Resource_name$</b> - Resources that
          end with Resource_name will be purged.</li></ul>
        schema:
          type: string
      - name: purge_tag_names
        in: query
        description: A comma separated list of tag names to purge.
        schema:
          type: string
      responses:
        '200':
          description: res - contains the specific error code:<br/>5010 - Pattern
            invalid<br/>9413 - Unknown/unauthorized site_id.<br/>9415 - Operation
            not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
