  /api/prov/v1/sites/performance/stale-content:
    post:
      tags:
      - Site Management
      summary: Modify stale content settings
      description: When Imperva can't connect to the origin server, serve stale content
        instead of displaying an error to end users for the specified amount of time.
        Expired resources are returned from cache, and refreshed asynchronously in
        the background.
      operationId: modifyStaleContent
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on
        required: true
        schema:
          type: string
        example: 10
      - name: serve_stale_content
        in: query
        description: Pass <b>true</b> to serve stale content, <b>false</b> to disable
          the option.
        required: true
        schema:
          type: string
        example: true
      - name: stale_content_mode
        in: query
        description: Pass <b>ADAPTIVE</b> to use Imperva's algorithm, or <b>CUSTOM</b>
          to specify an amount of time. When using <b>CUSTOM</b>, you must specify
          the time and time_unit parameters.
        required: true
        schema:
          type: string
        example: ADAPTIVE
      - name: time
        in: query
        description: A positive number representing the amount of time to serve stale
          content.
        schema:
          type: string
        example: 10
      - name: time_unit
        in: query
        description: Stale content time unit. One of SECONDS, MINUTES, HOURS.
        schema:
          type: string
        example: MINUTES
      responses:
        '200':
          description: 'res - contains the specific error code:<br/>2 - Invalid input<br/>9413
            - Unknown/unauthorized site_id<br/>9415 - Operation not allowed<br/>5
            - Operation unavailable '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
