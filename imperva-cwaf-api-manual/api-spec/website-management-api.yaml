components:
  schemas:
    APIError:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        id:
          type: string
        source:
          type: object
          additionalProperties:
            type: object
        status:
          type: integer
          format: int32
        title:
          type: string
    AccountInboundTLSConfigurationRequest:
      type: object
      properties:
        data:
          maxItems: 1
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/InboundTlsSettings"
    CertificateSettings:
      type: object
      properties:
        validationMethod:
          type: string
          description: The method used by Imperva to validate domain ownership.
          readOnly: true
          example: CNAME
      description: Certificate Settings entity
    CollectionSite:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Site"
    CollectionSiteOnboardResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SiteOnboardResponse"
    CollectionSiteTLSConfiguration:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SiteTLSConfiguration"
    DnsOnboardingInstructionDto:
      type: object
      properties:
        description:
          type: string
          description: instruction's description
          readOnly: true
        host:
          type: string
          description: DNS record host
          readOnly: true
          example: www.example.com
        recordType:
          type: string
          description: DNS record type
          readOnly: true
          example: CNAME
        value:
          type: string
          description: DNS record value
          readOnly: true
          example: abc.impervadns.net
      description: site onboarding DNS instruction
      example:
        description: Add the following record to your DNS provider
        recordType: A
        value: 1.2.3.4
        host: example.com
    Domain:
      type: object
      properties:
        id:
          type: integer
          description: The ID of the domain
          format: int64
          readOnly: true
          example: 123456
        name:
          type: string
          description: The domain name
          example: www.example.com
        protectionStatus:
          type: string
          description: "The domain ownership verification status. Possible values:
            BYPASSED, MISCONFIGURED, VERIFIED, PROTECTED"
          readOnly: true
          example: BYPASSED
      description: Domain entity
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/APIError"
    InboundTlsSettings:
      type: object
      properties:
        configurationProfile:
          type: string
          description: TLS configuration profile is an enumeration of predefined
            configuration profiles.It can also be set to CUSTOM, for setting
            custom TLS configuration.
          enum:
            - CUSTOM
            - DEFAULT
            - ENHANCED_SECURITY
        tlsConfiguration:
          type: array
          description: List of supported TLS versions and ciphers related to the specific
            version. This list holds the CUSTOM configuration that is going to
            be used in the communication between the client and Imperva. If the
            list is empty a predefined configuration profile should be used.
          items:
            $ref: "#/components/schemas/TLSVersion"
    PaginatedCollectionSite:
      required:
        - data
      type: object
      properties:
        data:
          type: array
          description: API paginated response data
          items:
            $ref: "#/components/schemas/Site"
        links:
          type: object
          additionalProperties:
            type: string
            description: API pagination links
          description: API pagination links
        meta:
          $ref: "#/components/schemas/PaginationMetadata"
    PaginationMetadata:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      description: API pagination metadata
    Servers:
      type: object
      properties:
        ips:
          type: array
          description: Data Center's origin server IPs/CNAMEs
          example:
            - 1.2.3.4
            - 3.2.2.2
          items:
            type: string
      description: Server entity
    Site:
      required:
        - name
        - type
      type: object
      properties:
        accountId:
          type: integer
          description: The account ID of the site
          format: int64
          readOnly: true
          example: 10
        active:
          type: boolean
          description: Whether the site is active or bypassed by the Imperva network
          example: true
          default: true
        cname:
          type: string
          description: The CNAME provided by Imperva that is used for pointing your
            website traffic to the Imperva network. This is not relevant for
            site type of LOCAL or PUBLIC_CLOUD.
          readOnly: true
          example: sdh5s.example.com
        creationTime:
          type: integer
          description: The creation date of the site
          format: int64
          readOnly: true
          example: 1673186130
        deploymentKeys:
          type: array
          description: Deployment keys
          example: 4d0654aa-8d16-46f6-8158-a42a1b48e48b
          items:
            type: string
            description: Deployment keys
            format: uuid
            example: 4d0654aa-8d16-46f6-8158-a42a1b48e48b
        id:
          type: integer
          description: The ID of the site.
          format: int64
          readOnly: true
          example: 123456
        isDefaultSite:
          type: boolean
          description: Default anywhere site
          readOnly: true
          example: false
        name:
          type: string
          description: Friendly name of the site.
          example: www.example.com
        refId:
          type: string
          description: Sets the Reference ID, a free-text field that enables you to add a
            unique identifier to correlate a website in our service with an
            object on the customer side
          example: 123abc
        siteStatus:
          type: string
          description: The status
          readOnly: true
          example: CONFIGURED
          enum:
            - CONFIGURED
            - PARTIALLY_CONFIGURED
            - NOT_CONFIGURED
            - UNKNOWN
        type:
          type: string
          description: The website type. Indicates which kind of website is created, e.g.
            CLOUD_WAF for a website onboarded to Imperva Cloud WAF.
          example: CLOUD_WAF
          enum:
            - CLOUD_WAF
            - LOCAL
            - PUBLIC_CLOUD
      description: Site entity
    SiteHstsConfiguration:
      type: object
      properties:
        isEnabled:
          type: boolean
          description: Enable/disable HSTS support for this website
          default: false
        maxAge:
          minimum: 0
          type: integer
          description: (TTL) The amount of time in seconds to apply HSTS in the browser
            before attempting to load the page using http://.
          format: int64
          example: 7543
          default: 31536000
        preLoaded:
          type: boolean
          description: The most secure way to enforce HSTS. Ensures the first request goes
            out in a secure tunnel, since the browser already has that URL in
            the pre-load list. The domain needs to be listed at
            https://hstspreload.appspot.com/.
          default: false
        subDomainsIncluded:
          type: boolean
          description: Enforce HSTS on sub-domains. For example, a page listed on
            xxx.ddd.com uses resources from images.ddd.com. If HSTS for
            sub-domains is enabled, the images are also covered. Make sure that
            the site and all sub-domains support HTTPS so that HSTS does not
            break an internal resource when rendering the page.
          default: false
      description: HTTP Strict transport security (HSTS) ensures that any attempt by
        visitors to use the unsecure version (http://) of a page will be
        forwarded automatically to the secure version (https://).
    SiteOnboardResponse:
      type: object
      properties:
        certificateSettings:
          $ref: "#/components/schemas/CertificateSettings"
        domains:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
        instructions:
          type: object
          additionalProperties:
            type: array
            description: Site onboarding instructions list
            example:
              Network:
                - description: Add the following record to your DNS provider
                  host: example.com
                  recordType: A
                  value: 1.2.3.4
                - description: Add the following record to your DNS provider
                  host: example.com
                  recordType: A
                  value: 5.6.7.8
                - description: Add the following record to your DNS provider
                  host: www.example.com
                  recordType: CNAME
                  value: asdasd.ng.impervadns.net
              SSL:
                - description: Add the following record to your DNS provider
                  host: _delegate_validation.example.com
                  recordType: CNAME
                  value: qweqwe.ng.impervadns.net
            items:
              $ref: "#/components/schemas/DnsOnboardingInstructionDto"
          description: Site onboarding instructions list
          example:
            Network:
              - description: Add the following record to your DNS provider
                host: example.com
                recordType: A
                value: 1.2.3.4
              - description: Add the following record to your DNS provider
                host: example.com
                recordType: A
                value: 5.6.7.8
              - description: Add the following record to your DNS provider
                host: www.example.com
                recordType: CNAME
                value: asdasd.ng.impervadns.net
            SSL:
              - description: Add the following record to your DNS provider
                host: _delegate_validation.example.com
                recordType: CNAME
                value: qweqwe.ng.impervadns.net
        servers:
          $ref: "#/components/schemas/Servers"
        site:
          $ref: "#/components/schemas/Site"
      description: Site onboarding response entity
    SiteOnboardingRequest:
      required:
        - domain
      type: object
      properties:
        domain:
          type: string
          description: The domain of the site
          example: my.domain.com
        generateCertificate:
          type: boolean
          description: Indicates whether to automatically generate an SSL certificate.
            When set to false, SSL certificate generation is disabled.
          example: false
          default: true
        name:
          type: string
          description: The name of the site. If not specified, the domain name is used.
          example: my site
        servers:
          type: array
          description: List of your origin server IP addresses or CNAMEs.
          example:
            - 1.2.3.4
            - 3.2.2.2
          items:
            type: string
        type:
          type: string
          description: The website type. Indicates which kind of website is created, e.g.
            CLOUD_WAF for a website onboarded to Imperva Cloud WAF.
          example: CLOUD_WAF
          default: CLOUD_WAF
          enum:
            - CLOUD_WAF
            - LOCAL
            - PUBLIC_CLOUD
      description: Site onboarding request entity
    SiteSpaFullSettingsDto:
      required:
        - state
      type: object
      properties:
        allowedSpaDomains:
          type: array
          description: List of allowed cross-origin domains for the SPA site. The SPA
            script is allowed to add SPA-specific request headers when the
            application makes requests to these domains.
          items:
            type: string
            description: List of allowed cross-origin domains for the SPA site. The SPA
              script is allowed to add SPA-specific request headers when the
              application makes requests to these domains.
        preProdSettings:
          $ref: "#/components/schemas/SiteSpaPreProdSettingsDto"
        prodVersion:
          type: string
          description: The SPA script version to be used for the website. This parameter
            is optional. If not specified, the latest version is used.
          example: "1.1"
        state:
          type: string
          description: >-
            The SPA configuration option for the specified website. Possible
            values: SPA, SPA FOR_SPECIFIC_URLS, SPA_ EXCEPT_URLS, NOT_SPA.


            Imperva recommends configuring SPA support for the entire website.
            The other options should be used only for rare cases where SPA
            functionality is seen to interfere with specific pages, and in
            consultation with Imperva.
          example: SPA_FOR_SPECIFIC_URLS
          enum:
            - NOT_SPA
            - SPA_EXCEPT_URLS
            - SPA_FOR_SPECIFIC_URLS
            - SPA
        urlList:
          type: array
          description: The list of URLs to be used together with either the SPA
            FOR_SPECIFIC_URLS or SPA_ EXCEPT_URLS parameter to define SPA
            support for only a subset of your website.
          example:
            - /url1
            - /url2
            - /url3
          items:
            type: string
            description: The list of URLs to be used together with either the SPA
              FOR_SPECIFIC_URLS or SPA_ EXCEPT_URLS parameter to define SPA
              support for only a subset of your website.
            example: '["/url1","/url2","/url3"]'
    SiteSpaFullSettingsV3ResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SiteSpaFullSettingsDto"
    SiteSpaPreProdSettingsDto:
      type: object
      properties:
        headers:
          type: array
          description: The list of headers to be used together with the preProdVersion
            parameter to provide execution of a specific spa version.
          example:
            - header1
            - header2
            - header3
          items:
            type: string
            description: The list of headers to be used together with the preProdVersion
              parameter to provide execution of a specific spa version.
            example: '["header1","header2","header3"]'
        preProdVersion:
          type: string
          description: The pre production SPA script version to be used for the website.
            This parameter is optional. If not specified, the latest version is
            used.
          example: "1.1"
      description: The pre-production SPA settings to be used for the website. This
        parameter is optional.
    SiteSpaSettingsApiResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SiteSpaSettingsDto"
    SiteSpaSettingsDto:
      required:
        - state
      type: object
      properties:
        allowedSpaDomains:
          type: array
          description: List of allowed cross-origin domains for the SPA site. The SPA
            script is allowed to add SPA-specific request headers when the
            application makes requests to these domains.
          items:
            type: string
            description: List of allowed cross-origin domains for the SPA site. The SPA
              script is allowed to add SPA-specific request headers when the
              application makes requests to these domains.
        preProdSettings:
          $ref: "#/components/schemas/SiteSpaPreProdSettingsDto"
        prodVersion:
          type: string
          description: The SPA script version to be used for the website. This parameter
            is optional. If not specified, the latest version is used.
          example: "1.1"
        state:
          type: boolean
          description: >-
            The SPA configuration state for the specified website.


            Imperva recommends configuring SPA support for the entire website.
            The other options should be used only for rare cases where SPA
            functionality is seen to interfere with specific pages, and in
            consultation with Imperva.
          example: true
    SiteTLSConfiguration:
      type: object
      properties:
        disablePQCSupport:
          type: boolean
          description: Disable Post-Quantum Cryptography support for SNI traffic.
          default: false
        hstsConfiguration:
          $ref: "#/components/schemas/SiteHstsConfiguration"
        inboundTlsSettings:
          $ref: "#/components/schemas/InboundTlsSettings"
    SiteTLSConfigurationRequest:
      type: object
      properties:
        data:
          maxItems: 1
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/SiteTLSConfiguration"
    TLSVersion:
      type: object
      properties:
        ciphersSupport:
          type: array
          description: List of RFC cipher names supported for the specified TLS version.
            This configuration is used when the CUSTOM configuration profile is
            selected. Please refer to
            https://docs.imperva.com/bundle/cloud-application-security/page/cipher-suites.htm
            for the list of ciphers.
          items:
            type: string
            description: List of RFC cipher names supported for the specified TLS version.
              This configuration is used when the CUSTOM configuration profile
              is selected. Please refer to
              https://docs.imperva.com/bundle/cloud-application-security/page/cipher-suites.htm
              for the list of ciphers.
        tlsVersion:
          type: string
          description: "TLS version name. For example: TLS_1_2"
          enum:
            - TLS_1_0
            - TLS_1_1
            - TLS_1_2
            - TLS_1_3
      description: List of supported TLS versions and ciphers related to the specific
        version. This list holds the CUSTOM configuration that is going to be
        used in the communication between the client and Imperva. If the list is
        empty a predefined configuration profile should be used.
  securitySchemes:
    api_id:
      description: An API ID created and managed in the Imperva Cloud Security Console
        and used for authentication
