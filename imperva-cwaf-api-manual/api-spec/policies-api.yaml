        accountId:
          type: integer
          format: int64
          description: The Account Id Of the Policy
          example: 10
        defaultPolicyConfig:
          type: array
          description: "Sets the specified policy as default for the account, or indicates\
            \ that the policy is set as default. A default policy is used by any new\
            \ website added to the account."
          items:
            $ref: '#/components/schemas/DefaultPolicyConfigDto'
        description:
          type: string
          description: The Policy description
          example: This is policy blocks all requests from Europe
        enabled:
          type: boolean
          description: "Enable or disable the policy. A WAF Rules policy is always\
            \ created in the enabled state, and cannot be disabled."
        name:
          type: string
          description: The Policy name
          example: Block ip Policy
        policySettings:
          type: array
          description: The Policy settings configuration
          items:
            $ref: '#/components/schemas/PolicySettingsDto'
        policyType:
          type: string
          description: The Policy type
          enum:
          - ACL
          - WHITELIST
          - WAF_RULES
          - FILE_UPLOAD
    UrlsDto:
      type: object
      properties:
        pattern:
          type: string
          description: URL pattern for rule
          enum:
          - EQUALS
          - NOT_EQUALS
          - NOT_CONTAINS
          - PREFIX
          - SUFFIX
          - NOT_PREFIX
          - NOT_SUFFIX
          - CONTAINS
          - "EQUALS,NOT_EQUALS,NOT_CONTAINS,PREFIX,SUFFIX,NOT_PREFIX,NOT_SUFFIX,CONTAINS"
        url:
          type: string
          description: URL value
          example: /test
    value:
