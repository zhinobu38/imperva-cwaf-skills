      type: object
      properties:
        rule_name:
          type: string
          description: The rule name
          example: Custom rule 1
        action:
          type: string
          description: "Rule action. Possible values: <br/><ul><li><b>RULE_ACTION_REDIRECT</b>\
            \ Redirect the client to a different URL, responding with a 30X response.</li><li><b>RULE_ACTION_SIMPLIFIED_REDIRECT</b>\
            \ Redirect the client to a different URL, responding with a 30X response.</li><li><b>RULE_ACTION_REWRITE_URL</b>\
            \ Modify the path to which a specific request is targeted.</li><li><b>RULE_ACTION_REWRITE_HEADER</b>\
            \ Modify or add a request header before passing traffic to the origin\
            \ server.</li><li><b>RULE_ACTION_REWRITE_COOKIE</b> Modify or add cookies\
            \ that are sent by the client to the origin server. The cookie name and\
            \ value should be indicated.</li><li><b>RULE_ACTION_DELETE_HEADER</b>\
            \ Remove a specific request header, which means that it won\u2019t be\
            \ sent to the origin server.</li><li><b>RULE_ACTION_DELETE_COOKIE</b>\
            \ Remove a specific cookie set on the client, which means that it won\u2019\
            t be sent to the origin server.</li><li><b>RULE_ACTION_FORWARD_TO_DC</b>\
            \ Define the data center to which a specific request will be sent.</li><li><b>RULE_ACTION_FORWARD_TO_PORT</b>\
            \ Define the port to which a specific request will be sent.</li><li><b>RULE_ACTION_RESPONSE_REWRITE_HEADER</b>\
            \ Modify or add a header to the response received from the origin server.</li><li><b>RULE_ACTION_RESPONSE_DELETE_HEADER</b>\
            \ Remove a specific response header, which means that it won't be returned\
            \ to the client.</li><li><b>RULE_ACTION_RESPONSE_REWRITE_RESPONSE_CODE</b>\
            \ Modify the response code received from the origin server.</li><li><b>RULE_ACTION_CUSTOM_ERROR_RESPONSE</b>\
            \ Control the error response that is returned to the client when a request\
            \ is blocked.</li></ul>"
          example: RULE_ACTION_REDIRECT
          enum:
          - RULE_ACTION_NONE
          - RULE_ACTION_EXCLUDE
          - RULE_ACTION_NOP
          - RULE_ACTION_SESSION_COUNTER_INC
          - RULE_ACTION_SET_CAPTCHA_FAILED
          - RULE_ACTION_SET_DUAL_FACTOR_AUTHENTICATION_FAILED
