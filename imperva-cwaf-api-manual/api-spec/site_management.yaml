openapi: 3.0.1
info:
  title: Cloud Application Security API
  description: 'Imperva provides customers and partners with the ability to manage
    accounts and sites via an API.

    For more information, see <a style="text-decoration:none" href="https://docs.imperva.com/csh?context=my_api">Cloud
    Application Security API Reference</a>.'
  license:
    name: Imperva License Agreement.
    url: http://www.imperva.com/other/license_agreement.asp
  version: '1.0'
servers:
- url: https://my.imperva.com
  description: Imperva API server
components:
  schemas:
    DataCentersConfigurationDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataCentersConfiguration'
    ApiResultSetSupportDeprecatedTLSForSite:
      type: object
      properties:
        res:
          type: integer
          description: res - contains specific error code
          format: int32
          example: 0
        res_message:
          type: string
          example: OK
        debug_info:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              description: General information which is not strictly required for
                using the API
            description: General information which is not strictly required for using
              the API
        support_all_tls_versions:
          type: boolean
          example: true
        new_A_record:
          type: string
          example: 1.2.3.4
        additional_instructions:
          type: string
          example: "After the site is moved, update the site\u2019s 'A' records according\
            \ to the information in Websites General Settings."
    RequestBodyTimeoutDTO:
      type: object
      properties:
        methods:
          type: array
          items:
            type: object
        interval:
          type: integer
          format: int32
        byteCount:
          type: integer
          format: int32
        requestBodyTimeouts:
          $ref: '#/components/schemas/RequestBodyTimeoutDTO'
    ApiErrorSource:
      type: object
      properties:
        pointer:
          type: string
          description: a JSON Pointer [RFC6901] to the erroneous JSON element in the
            request payload
          example: $.data[0].fieldName
        parameter:
          type: string
          description: The name of erroneous query/path parameter name
          example: extSiteId
      description: Pointer to source of error
    ApiResultSiteStatus:
      type: object
      properties:
        res:
          type: integer
          description: res - contains specific error code
          format: int32
          example: 0
        res_message:
          type: string
          example: OK
        debug_info:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              description: General information which is not strictly required for
                using the API
            description: General information which is not strictly required for using
              the API
        site_id:
          type: integer
          format: int64
          example: 10
        statusEnum:
          type: string
          example: pending-dns-changes
          enum:
          - pending-txt-validation
          - pending-dns-changes
          - fully-configured
          - pending-select-approver
          - pending-certificate
          - unknown
        status:
          type: string
          example: pending-dns-changes
        domain:
          type: string
          example: admin@example.com
        account_id:
          type: integer
          format: int64
          example: 1
        acceleration_level:
          type: string
          example: advanced
        acceleration_level_raw:
          type: string
          example: none
        site_creation_date:
          type: integer
          format: int64
          example: 1610396346000
        ips:
          type: array
          items:
            type: object
            example: 1.2.3.4
        dns:
          type: array
          items:
            $ref: '#/components/schemas/DnsInstructionItem'
        original_dns:
          type: array
          items:
            $ref: '#/components/schemas/DnsInstructionItem'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SiteConfigurationWarning'
        active:
          type: string
          example: active
          enum:
          - active
          - bypass
        support_all_tls_versions:
          type: boolean
          example: true
        use_wildcard_san_instead_of_full_domain_san:
          type: boolean
          example: true
        add_naked_domain_san:
          type: boolean
          example: true
        set_site_cookies_without_domain:
          type: boolean
          example: true
        enable_http_between_Imperva_and_origin:
          type: string
          example: '80'
        additionalErrors:
          type: array
          items:
            type: object
            description: Additional error codes that provide details of the site's
              status
            example: 3005
        display_name:
          type: string
          example: loginprotectapi1610396334653.incaptest.info
        security:
          type: array
          example:
            waf:
              rules:
              - id: api.threats.bot_access_control
                name: Bot Access Control
                block_bad_bots: true
                challenge_suspected_bots: true
              - id: api.threats.sql_injection
                name: SQL Injection
                action: api.threats.action.block_request
                action_text: Block Request
              - id: api.threats.cross_site_scripting
                name: Cross Site Scripting (XSS)
                exceptions:
                - values:
                  - urls:
                    - value: /gsddg
                      pattern: EQUALS
                    id: api.rule_exception_type.url
                    name: URL
                  id: 244711494
                action: api.threats.action.alert
                action_text: Alert Only
              - id: api.threats.illegal_resource_access
                name: Illegal Resource Access
                action: api.threats.action.block_user
                action_text: Block User
              - id: api.threats.ddos
                name: DDoS
                activation_mode: api.threats.ddos.activation_mode.off
                activation_mode_text: 'Off'
                ddos_traffic_threshold: api.threats.ddos.ddos_trassic_threshold
                ddos_traffic_threshold_text: '750'
                ddos_adaptive_threshold: '500'
                ddos_adaptive_threshold_last_update_time: '1610396346000'
              - id: api.threats.backdoor
                name: Backdoor Protect
                action: api.threats.action.quarantine_url
                action_text: Auto-Quarantine
              - action: api.threats.action.block_ip
                action_text: Block IP
                id: api.threats.remote_file_inclusion
                name: Remote File Inclusion
            acls:
              rules:
              - ips:
                - 2.3.4.5
                exceptions:
                - values:
                  - id: api.rule_exception_type.url
                    name: URL
                    urls:
                    - value: /home
                      pattern: EQUALS
                  id: 493271006
                id: api.acl.blacklisted_ips
                name: Visitors from denylisted IPs
          items:
            type: object
            additionalProperties:
              type: object
        ssl:
          type: array
          example:
            origin_server:
              detected: 'true'
              detectionStatus: ok
          items:
            type: object
            additionalProperties:
              type: object
        siteDualFactorSettings:
          $ref: '#/components/schemas/SiteDualFactorSettings'
        requestBodyTimeouts:
          $ref: '#/components/schemas/RequestBodyTimeoutDTO'
        login_protect:
          $ref: '#/components/schemas/LoginProtectApiResult'
        performance_configuration:
          $ref: '#/components/schemas/PerformanceConfigurationApiResult'
        extended_ddos:
          type: integer
          format: int32
        incap_rules:
          type: array
          items:
            $ref: '#/components/schemas/IncapRuleApiResult'
        restricted_cname_reuse:
          type: boolean
          example: true
    CustomRulesDTOSuccessResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BaseRuleDtoExtended'
        meta:
          $ref: '#/components/schemas/APIPaginationMetadata'
    ListDataCenterResponse:
      type: object
      example:
      - name: example
        originPop: atl
        isActive: true
        id: '54313'
        enabled: 'false'
        isStandBy: 'false'
        servers:
        - id: '1034487'
          enabled: 'true'
          address: 69.61.27.182
          isStandby: 'true'
        contentOnly: 'true'
    ApiResultListSites:
      type: object
      properties:
        res:
          type: integer
          description: res - contains specific error code
          format: int32
          example: 0
        res_message:
          type: string
          example: OK
        debug_info:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              description: General information which is not strictly required for
                using the API
            description: General information which is not strictly required for using
              the API
        ApiResultSiteStatus:
          type: array
          items:
            $ref: '#/components/schemas/ApiResultSiteStatus'
    HSTSConfiguration:
      type: object
      properties:
        isEnabled:
          type: boolean
          description: Enable/disable HSTS support for this website
          default: false
        maxAge:
          minimum: 0
          type: integer
          description: (TTL) The amount of time in seconds to apply HSTS in the browser
            before attempting to load the page using http://.
          format: int64
          example: 7543
          default: 31536000
        subDomainsIncluded:
          type: boolean
          description: Enforce HSTS on sub-domains. For example, a page listed on
            xxx.ddd.com uses resources from images.ddd.com. If HSTS for sub-domains
            is enabled, the images are also covered. Make sure that the site and all
            sub-domains support HTTPS so that HSTS does not break an internal resource
            when rendering the page.
          default: false
        preLoaded:
          type: boolean
          description: The most secure way to enforce HSTS. Ensures the first request
            goes out in a secure tunnel, since the browser already has that URL in
            the pre-load list. The domain needs to be listed at https://hstspreload.appspot.com/.
          default: false
      description: HTTP Strict transport security (HSTS) ensures that any attempt
        by visitors to use the unsecure version (http://) of a page will be forwarded
        automatically to the secure version (https://).
    ApiResultGetRewritePorts:
      type: object
      properties:
        res:
          type: integer
          description: res - contains specific error code
          format: int32
          example: 0
        res_message:
          type: string
          example: OK
        debug_info:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              description: General information which is not strictly required for
                using the API
            description: General information which is not strictly required for using
              the API
        port:
          $ref: '#/components/schemas/RewritePort'
        ssl_port:
          $ref: '#/components/schemas/RewritePort'
    PerformanceConfigurationApiResult:
      type: object
      properties:
        advanced_caching_rules:
          type: array
          example:
            never_cache_resources:
            - pattern: SUFFIX
              url: /test.html
            always_cache_resources:
            - pattern: NOT_EQUALS
              url: /index.html
              ttl: '5'
              ttlUnits: SECONDS
            - pattern: EQUALS
              url: /home.html
              ttl: '6'
              ttlUnits: DAYS
          items:
            type: object
            additionalProperties:
              type: object
        acceleration_level:
          type: string
          example: advanced
        acceleration_level_raw:
          type: string
          example: none
        async_validation:
          type: boolean
          example: true
        minify_javascript:
          type: boolean
          example: true
        minify_css:
          type: boolean
          example: true
        minify_static_html:
          type: boolean
          example: true
        compress_jpeg:
          type: boolean
          example: true
        compress_jepg:
          type: boolean
          example: true
        progressive_image_rendering:
          type: boolean
          example: true
        aggressive_compression:
          type: boolean
          example: true
        compress_png:
          type: boolean
          example: true
        on_the_fly_compression:
          type: boolean
          example: true
        tcp_pre_pooling:
          type: boolean
          example: true
        comply_no_cache:
          type: boolean
          example: true
        comply_vary:
          type: boolean
          example: true
        use_shortest_caching:
          type: boolean
          example: true
        perfer_last_modified:
          type: boolean
          example: true
        prefer_last_modified:
          type: boolean
          example: true
        disable_client_side_caching:
          type: boolean
          example: true
        cache300x:
          type: boolean
          example: true
        cache_headers:
          uniqueItems: true
          type: array
          items:
            type: object
    ApiErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
    ApiResultGetSiteXrayLink:
      type: object
      properties:
        res:
          type: integer
          description: res - contains specific error code
          format: int32
          example: 0
        res_message:
          type: string
          example: OK
        debug_info:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              description: General information which is not strictly required for
                using the API
            description: General information which is not strictly required for using
              the API
        url:
          type: string
          example: https://
    ApiResultAddCacheRule:
      type: object
      properties:
        res:
          type: integer
          description: res - contains specific error code
          format: int32
          example: 0
        res_message:
          type: string
          example: OK
        debug_info:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              description: General information which is not strictly required for
                using the API
            description: General information which is not strictly required for using
              the API
        rule_id:
          type: integer
          format: int64
          example: 10
    ServerOperationResponse:
      type: object
      properties:
        server_id:
          type: string
          example: '2'
        status:
          type: string
          example: ok
        res:
          type: string
          example: '0'
    specific_users_list:
      type: object
      properties:
        email:
          type: string
          description: email
          example: John@example.com
        name:
          type: string
          description: name
          example: John Doe
        status:
          type: string
          description: status
          example: INVITATION_SENT
    ApiResultSetDataRegion:
      type: object
      properties:
        res:
          type: integer
          description: res - contains specific error code
          format: int32
          example: 0
        res_message:
          type: string
          example: OK
        debug_info:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              description: General information which is not strictly required for
                using the API
            description: General information which is not strictly required for using
              the API
        region:
          type: string
          example: US
    ApiResultReport:
      type: object
      properties:
        res:
          type: integer
          description: res - contains specific error code
          format: int32
          example: 0
        res_message:
          type: string
          example: OK
        debug_info:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              description: General information which is not strictly required for
                using the API
            description: General information which is not strictly required for using
              the API
        format:
          type: string
          example: pdf
          enum:
          - html
          - xml
          - amf
          - pdf
          - flash
          - json
          - mail
          - csv
          - statistics
          - syslog
        report:
          type: string
          example: JVBERi0xLjUNCiXvv73vv73vv73vv70NCjEgMCBvYmoNCjw8L1R5cGUvQ2F0YWxvZy9QYWdlcyAyIDAgUi9MYW5nKGVuLVVT
            ...
    DataCenterConfiguration:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: Data center name
          example: London DC
        id:
          type: integer
          description: Data center id
          format: int64
          example: 7543
        ipMode:
          type: string
          description: "Load-balancing mode.<br/>Possible values:<ul><li><b>SINGLE_IP</b>\
            \ - Use it only when you need to support multiple ports. Allows a single\
            \ active server listening on multiple ports, plus the option of a single\
            \ standby server. Traffic is distributed across the server ports.<br/><b>Note</b>:\
            \ The server address must be a valid IP address (i.e. not host/domain\
            \ name).<br/>SINGLE_IP is applicable only for datacenters. It may not\
            \ be used when dataCenterMode = \u2018SINGLE_SERVER\u2019.</li><li><b>MULTIPLE_IP</b>\
            \ \u2013 Allows one or more origin servers having a single webserver and\
            \ listening port per server. Traffic is distributed across servers.</li></ul>"
          example: MULTIPLE_IP
          default: MULTIPLE_IP
          enum:
          - SINGLE_IP
          - MULTIPLE_IP
        webServersPerServer:
          maximum: 100
          minimum: 1
          type: integer
          description: When IP mode = SINGLE_IP, number of webservers per server.
            Each webserver listens to different port. E.g. when webServersPerServer
            = 5, HTTP traffic will use ports 80-84 while HTTPS traffic will use ports
            443-447
          format: int32
          example: 5
          default: 1
        lbAlgorithm:
          type: string
          description: Specifies how to load balance between the servers of this data
            center
          example: WEIGHTED
          default: LB_LEAST_PENDING_REQUESTS
          enum:
          - LB_LEAST_PENDING_REQUESTS
          - LB_LEAST_OPEN_CONNECTIONS
          - LB_SOURCE_IP_HASH
          - RANDOM
          - WEIGHTED
        weight:
          maximum: 100
          minimum: 0
          type: integer
          description: Weight in pecentage. Mandatory if lbAlgorithm = WEIGHTED_LB.
            Then, total weights of all data centers must be equal to 100
          format: int32
          example: 40
        isEnabled:
          type: boolean
          description: For each site, at least one data center must be enabled
          example: false
          default: true
        isActive:
          type: boolean
          description: Specify false to define a standby datacenter. No more than
            one data center can be defined as standby. Failover to standby data center
            is performed only when no other active data center is available
          example: false
          default: true
        isContent:
          type: boolean
          description: When true, this data center will only handle requests that
            were routed to it using application delivery forward rules. If true, must
            be an active data center.
          example: true
          default: false
        isRestOfTheWorld:
          type: boolean
          description: When global lbAlgorithm = GEO_PREFERRED or GEO_REQUIRED, exactly
            one data center must have isRestOfTheWorld = true. This data center will
            handle traffic from any region that is not assigned to a specific data
            center.
          example: true
          default: false
        geoLocations:
          type: array
          items:
            type: string
            description: List of geo regions that this data center will serve. Mandatory
              if global lbAlgorithm = GEO_PREFERRED or GEO_REQUIRED.
            example: AFRICA
            enum:
            - EUROPE
            - AUSTRALIA
            - US_EAST
            - US_WEST
            - AFRICA
            - ASIA
            - SOUTH_AMERICA
            - NORTH_AMERICA
        originPop:
          maxLength: 3
          minLength: 3
          type: string
          description: "The ID of the PoP that serves as an access point between Imperva\
            \ and the customer\u2019s origin server. For example: \"lax\", for Los\
            \ Angeles. When not specified, all Imperva PoPs can send traffic to this\
            \ data center. The list of available PoPs is documented at: https://docs.imperva.com/bundle/cloud-application-security/page/more/pops.htm"
          example: lax
        servers:
          type: array
          items:
            $ref: '#/components/schemas/DataCenterServerConfiguration'
    ListCustomRulesResponse:
      type: object
      properties:
        incap_rules:
          type: array
          example:
            All:
            - id: '3660'
              last_7_days_requests_count: '0'
              name: Ortal
              action: RULE_ACTION_ALERT
              filter: ''
          items:
            type: object
            additionalProperties:
              type: object
        delivery_rules:
          type: array
          example:
            Redirect:
            - to: /home.php
              id: '3648'
              priority: '1'
              last_7_days_requests_count: '0'
              name: Test new
              action: RULE_ACTION_REWRITE_URL
              from: '*/home.html'
              filter: ASN == 1
            Forward:
            - id: '3628'
              priority: '2'
              last_7_days_requests_count: '0'
              name: move to rewrite
              dc_id: '54313'
              action: RULE_ACTION_FORWARD_TO_DC
              filter: ''
          items:
            type: object
            additionalProperties:
              type: object
        rate_rules:
          type: array
          example:
            Rates:
            - id: '4723'
              enabled: 'true'
              interval: '120'
              name: Test Rate IP
              context: IP
              action: RULE_ACTION_RATE
              internal_name: test-rate-ip
              filter: ASN == 2
          items:
            type: object
            additionalProperties:
              type: object
    BaseRuleDTO:
      type: object
      properties:
        rule_id:
          type: integer
          format: int64
        name:
          type: string
        action:
          type: string
          enum:
          - RULE_ACTION_NONE
          - RULE_ACTION_EXCLUDE
          - RULE_ACTION_NOP
          - RULE_ACTION_SESSION_COUNTER_INC
          - RULE_ACTION_SET_CAPTCHA_FAILED
          - RULE_ACTION_SET_DUAL_FACTOR_AUTHENTICATION_FAILED
          - RULE_ACTION_SKIP_TEST_COOKIES
          - RULE_ACTION_NULL_ROUTE
          - RULE_ACTION_TRANSPARENT_HTML_JS_FORCE
          - RULE_ACTION_TRANSPARENT_HTML_JS_RELAXED
          - RULE_ACTION_HIDDEN_ALERT
          - RULE_ACTION_ALERT
          - RULE_ACTION_QUARANTINE_URL
          - RULE_ACTION_RETRY
          - RULE_ACTION_INTRUSIVE_HTML
          - RULE_ACTION_DDOS_ACTION
          - RULE_ACTION_CAPTCHA
          - RULE_ACTION_DUAL_FACTOR_AUTHENTICATE
          - RULE_ACTION_BLOCK
          - RULE_ACTION_BLOCK_USER
          - RULE_ACTION_BLOCK_IP
          - RULE_ACTION_BLOCK_IP_AGGRESSIVE
          - RULE_ACTION_REDIRECT
          - RULE_ACTION_REWRITE
          - RULE_ACTION_BYPASS_CACHE
          - RULE_ACTION_REWRITE_URL
          - RULE_ACTION_REWRITE_HEADER
          - RULE_ACTION_REWRITE_COOKIE
          - RULE_ACTION_DELETE
          - RULE_ACTION_DELETE_HEADER
          - RULE_ACTION_DELETE_COOKIE
          - RULE_ACTION_FORWARD_TO_DC
          - RULE_ACTION_RATE
          - RULE_ACTION_SIMPLIFIED_REDIRECT
          - RULE_ACTION_RESPONSE_DELETE_HEADER
          - RULE_ACTION_RESPONSE_REWRITE_HEADER
          - RULE_ACTION_CUSTOM_ERROR_RESPONSE
          - RULE_ACTION_RESPONSE_REWRITE_RESPONSE_CODE
          - RULE_ACTION_FORWARD_REQUEST
          - RULE_ACTION_FORWARD_TO_PORT
          - RULE_ACTION_WAF_OVERRIDE
          - RULE_ACTION_MASK
        enabled:
          type: boolean
    DataCenterResponse:
      type: object
      properties:
        datacenter_id:
          type: integer
          format: int32
          example: 484377
        status:
          type: string
          example: ok
        res:
          type: string
          example: '0'
    TLSConfigurationDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TLSConfiguration'
    TLSConfiguration:
      type: object
      properties:
        hstsConfiguration:
          $ref: '#/components/schemas/HSTSConfiguration'
    CreateNewCSRResponse:
      type: object
      properties:
