openapi: 3.0.0
info:
  description: |-
    Set up and manage the Imperva SIEM log integration.

    - Create, view, and edit connections to your log storage repository.

    - Configure which logs you want to receive from Imperva, and where to receive them.

    For full feature documentation, see  [Near Real-Time SIEM Log Integration](https://docs.imperva.com/bundle/cloud-application-security/page/siem-log-configuration.htm).
  license:
    name: The terms in the absence of an applicable signed agreement between you and Imperva
    url: https://www.imperva.com/legal/license-agreement/
  title: Imperva SIEM Configurations API 3.0
  version: 1.0.0
servers:
  - url: https://api.imperva.com/siem-config-service
    description: Imperva API server
security:
  - api_id: []
    api_key: []
tags:
  - description: The details of your log storage repository, including path and access credentials.
    name: Connections
  - description: Which logs you receive from Imperva and where you receive them.
    name: Log Configurations
paths:
  /v3/connections/:
    get:
      description: Retrieves details of all connections in the account.
      operationId: getAll_1
      parameters:
        - description: The Imperva Account ID. By default, the API operates on account (A) associated with the API credentials used for authentication. To operate on a different account (an account under the account (A)), specify the account ID
          in: query
          name: caid
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          content:
            application/json:
              examples:
                S3 ARN Response:
                  description: S3 ARN Response
                  value:
                    data:
                      - id: 6350f6f8be2e2a10af1d9de9
                        connectionName: S3 ARN Connection
                        assetId: '12345678'
                        storageType: CUSTOMER_S3_ARN
                        connectionInfo:
                          path: yourBucket/logs
                S3 Basic Auth Response:
                  description: S3 Basic Auth Response
                  value:
                    data:
                      - id: 6350f6f8be2e2a10af1d9de9
                        connectionName: S3 Connection
                        assetId: '12345678'
                        storageType: CUSTOMER_S3
                        connectionInfo:
                          accessKey: AKIAIOSFODNN7EXAMPLE
                          secretKey: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
                          path: /mybucket/logs
                SFTP Response:
                  description: SFTP Response
                  value:
                    data:
                      - id: 6350f6f8be2e2a10af1d9de9
                        connectionName: SFTP Connection
                        assetId: '123456712138'
                        storageType: CUSTOMER_SFTP
                        connectionInfo:
                          host: sftp.example.com
                          username: user123
                          password: password123
                          path: /logs
                Splunk Response:
                  description: Splunk Response
                  value:
                    data:
                      - id: 6350f6f8be2e2a10af1d9de9
                        connectionName: Splunk Connection
                        assetId: '12345678'
                        storageType: CUSTOMER_SPLUNK
                        connectionInfo:
                          host: splunk.example.com
                          port: 8088
                          token: 12345678-1234-1234-1234-1234567890ab
              schema:
                $ref: '#/components/schemas/ConnectionResponseWrapper'
          description: OK
        '400':
          content:
            application/json:
              examples:
                Bad Request:
                  description: Bad Request
                  value:
                    errors:
