  /v3/sites/{siteId}/settings/TLSConfiguration:
    get:
      description: Get website tls configuration settings by website id
      operationId: getSiteTLSConfiguration
      parameters:
        - description: Numeric identifier of the website.
          in: path
          name: siteId
          required: true
          schema:
            type: integer
            format: int64
        - description: The Imperva ID of the account or subaccount. By default, the
            account ID is the ID associated with the API credentials used for
            authentication. To run an API on a sub account, specify the sub
            account ID.
          in: query
          name: caid
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          content:
            application/json:
              examples:
                SPA:
                  description: SPA
                  value:
                    data:
                      - hstsConfiguration:
                          preLoaded: false
                          maxAge: 7543
                          subDomainsIncluded: false
                          isEnabled: true
                        inboundTlsSettings:
                          configurationProfile: CUSTOM
                          tlsConfiguration:
                            - tlsVersion: TLS_1_3
                              ciphersSupport:
                                - TLS_AES_128_GCM_SHA256
                                - TLS_CHACHA20_POLY1305_SHA256
                        disablePQCSupport: false
              schema:
                $ref: "#/components/schemas/SiteTLSConfigurationRequest"
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Error
      summary: Get website TLS configuration settings
      tags:
        - Website TLS configuration
    patch:
      description: Update TLS settings of an existing website. Only fields that are
        sent in the request will be updated.
      operationId: setSiteTLSConfiguration
      parameters:
        - description: Numeric identifier of the website.
          in: path
          name: siteId
          required: true
          schema:
            type: integer
            format: int64
        - description: The Imperva ID of the account or subaccount. By default, the
            account ID is the ID associated with the API credentials used for
            authentication. To run an API on a sub account, specify the sub
            account ID.
          in: query
          name: caid
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            examples:
              SPA:
                description: Enables and configure HSTS and sets custom ciphers profile with
                  support for just TLS v1.3 and specific list of ciphers.
                value:
                  data:
                    - hstsConfiguration:
                        preLoaded: false
                        maxAge: 7543
                        subDomainsIncluded: false
                        isEnabled: true
                      inboundTlsSettings:
                        configurationProfile: CUSTOM
                        tlsConfiguration:
                          - tlsVersion: TLS_1_3
                            ciphersSupport:
                              - TLS_AES_128_GCM_SHA256
                              - TLS_CHACHA20_POLY1305_SHA256
                      disablePQCSupport: false
            schema:
              $ref: "#/components/schemas/SiteTLSConfigurationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionSiteTLSConfiguration"
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Error
      summary: Modify website TLS configuration settings (partial update)
      tags:
        - Website TLS configuration
