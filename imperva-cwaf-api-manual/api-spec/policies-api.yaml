      properties:
        assetId:
          type: integer
          format: int64
        assetType:
          type: string
          description: The type of asset on which the policy is applied
          enum:
          - WEBSITE
          - WEBSITE
        id:
          type: integer
          format: int64
          description: The PolicySettings ID
          example: 10
        policyId:
          type: integer
          format: int64
  securitySchemes:
    api_id:
      description: An API ID created and managed in the Imperva Cloud Security Console
