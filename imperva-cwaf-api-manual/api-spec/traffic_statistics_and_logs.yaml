      - name: page_size
        in: query
        description: The number of objects to return in the response. Defaults to
          10. Maximum is 100.
        schema:
          type: string
        example: 15
      - name: page_num
        in: query
        description: The page to return starting from 0. Default to 0.
        schema:
          type: string
        example: 1
      - name: security
        in: query
        description: 'Filter the sessions that were handled according to the security-related
          specifications. Multiple values are supported, e.g.: "api.threats.sql_injection,
          api.acl.blacklisted_ips".'
        schema:
          type: string
        example: api.threats.sql_injection
      - name: country
        in: query
        description: Filter the sessions coming from the specified country.
        schema:
          type: string
        example: SE
      - name: ip
        in: query
        description: Filter the sessions coming from the specified IP.
        schema:
          type: string
        example: 1.2.3.4
      - name: visit_id
        in: query
        description: Comma separated list of visit IDs to load.
        schema:
          type: string
        example: 133077760038625800
      - name: list_live_visits
        in: query
        description: 'Whether or not to list visits that did not end and that may
