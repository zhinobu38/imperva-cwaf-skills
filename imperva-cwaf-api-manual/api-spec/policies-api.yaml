      - data
    PaginationMetadata:
      type: object
      description: API pagination metadata
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PolicyAccountsResult:
      type: object
      properties:
        isError:
          type: boolean
          description: States if an error has occurred
          example: false
        value:
          type: array
          description: Account Ids
          example:
          - 123456
          items:
            type: integer
            format: int64
            description: Account Ids
    PolicyAssetMappingResult:
      type: object
      properties:
        isError:
          type: boolean
          description: States if an error has occurred
          example: false
        value:
          type: array
          description: Policy Asset Mapping
          items:
            $ref: '#/components/schemas/value'
    PolicyBaseFailureResponse:
      type: object
      properties:
        isError:
          type: boolean
          description: States if an error has occurred
          example: true
        value:
          type: object
    PolicyDataExceptionDto:
      type: object
      description: The exception configuration on a given settings
      properties:
        comment:
          type: string
          description: Comment describing the exception and its reason
          example: exclude all ips for pen tests
        data:
          type: array
          description: The Filter/s of the exception
          items:
            $ref: '#/components/schemas/ExceptionsDataDto'
        id:
          type: integer
          format: int64
          description: The PolicyDataExceptions ID
          example: 10
        policySettingsId:
          type: integer
          format: int64
          description: The PolicySettings ID
          example: 55
    PolicyDto:
      type: object
      description: Policy meta data
      properties:
        accountId:
          type: integer
          format: int64
          description: The Account Id Of the Policy
          example: 10
        defaultPolicyConfig:
          type: array
          description: "Sets the specified policy as default for the account, or indicates\
            \ that the policy is set as default. A default policy is used by any new\
            \ website added to the account."
          items:
            $ref: '#/components/schemas/DefaultPolicyConfigDto'
        description:
          type: string
          description: The Policy description
          example: This is policy blocks all requests from Europe
        enabled:
          type: boolean
          description: "Enable or disable the policy. A WAF Rules policy is always\
            \ created in the enabled state, and cannot be disabled."
        name:
          type: string
          description: The Policy name
          example: Block ip Policy
        policySettings:
          type: array
          items:
            $ref: '#/components/schemas/PolicySettingsDto'
        policyType:
          type: string
          description: The Policy type
          enum:
          - ACL
          - WHITELIST
          - WAF_RULES
          - FILE_UPLOAD
      required:
      - enabled
      - name
      - policyType
    PolicyDtoResult:
      type: object
      properties:
        isError:
          type: boolean
          description: States if an error has occurred
          example: false
        value:
          $ref: '#/components/schemas/PolicyDto'
    PolicyDtoWithAssetsAndSubAccountsAssignment:
      type: object
      description: API paginated response data
      properties:
        accountId:
          type: integer
          format: int64
          description: The Account Id Of the Policy
          example: 10
        assetsIds:
          type: array
          description: Set of asset IDs that this policy assigned to.
