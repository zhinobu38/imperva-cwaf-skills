  /api/prov/v3/rules:
    get:
      tags:
      - Site Management
      summary: List rules
      description: Use this operation to list security rules by filters.
      operationId: listCustomRulesByFilter
      parameters:
      - name: siteIds
        in: query
        description: A list of website ids. If this parameter is provided, only rules
          of websites matching one of these IDs will be returned.
        schema:
          type: string
        example: 10,20
      - name: ruleIds
        in: query
        description: A list of rule ids. If this parameter is provided, only rules
          matching one of these IDs will be returned.
        schema:
          type: string
        example: 10,20
      - name: categories
        in: query
        description: A list of rule categories. If this parameter is provided, only
          rules matching one of these categories will be returned.
        schema:
          type: string
          enum:
          - WafOverride
          - WafOverride
          - RewriteResponse
          - SimplifiedRedirect
          - Security
          - Rates
          - Rewrite
          - Redirect
        example: Rates,WafOverride
      - name: subAccIds
        in: query
        description: A list of sub account IDs. When provided, the API returns rules
          corresponding to websites that belong to the specified sub account IDs.
          This parameter is ignored if the API call is authenticated as a sub account.
        schema:
          type: string
        example: 10,20
      - name: names
        in: query
        description: A list of rules names. If this parameter is provided, only rules
          matching one of these names will be returned.
        schema:
          type: string
        example: rule1,rule2
      - name: page_size
        in: query
        description: The number of objects to return in the response. Defaults to
          50. Maximum is 500
        schema:
          type: string
        example: 10
      - name: page_num
        in: query
        description: The page to return starting from 0. Default to 0
        schema:
          type: string
        example: 1
      responses:
        '200':
          description: res
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRulesDTOSuccessResponse'
