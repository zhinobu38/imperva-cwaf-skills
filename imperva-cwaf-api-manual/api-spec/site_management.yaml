      operationId: modifySiteAllowListsConfiguration
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on.
        required: true
        schema:
          type: string
        example: 15
      - name: rule_id
        in: query
        description: The id of the rule (either a security or an acl rule), e.g api.threats.bot_access_control.
          The following WAF rules should be updated via Policy WAF rules, api.threats.sql_injection,
          api.threats.cross_site_scripting, api.threats.illegal_resource_access and
          api.threats.remote_file_inclusion
        required: true
        schema:
          type: string
        example: api.threats.bot_access_control
      - name: allowlist_id
        in: query
        description: The id (an integer) of the allowlist to be set. This field is
          optional - in case no id is supplied, a new allowlist will be created.
        required: true
        schema:
          type: string
        example: 433245
      - name: delete_allowlist
        in: query
        description: An optional boolean parameter. If it is set to "true" and a allowlist
          id is sent, the allowlist will be deleted.
        schema:
          type: string
        example: false
      - name: urls
        in: query
        description: A comma separated list of resource paths.</br>For example, /home
          and /admin/index.html are resource paths, while <a href="http://www.example.com/home">http://www.example.com/home</a>
          is not.</br>Each URL should be encoded separately using percent encoding
          as specified by RFC 3986 (<a href="http://tools.ietf.org/html/rfc3986#section-2.1">http://tools.ietf.org/html/rfc3986#section-2.1</a>).<br/>An
          empty URL list will remove all URLs.
        schema:
          type: string
        example: /home
      - name: countries
        in: query
        description: A comma separated list of country codes.
        schema:
          type: string
        example: US
      - name: continents
        in: query
        description: A comma separated list of continent codes.
        schema:
          type: string
        example: SA
      - name: ips
        in: query
        description: 'A comma separated list of IPs or IP ranges, e.g: 192.168.1.1,
          192.168.1.1-192.168.1.100 or 192.168.1.1/24'
        schema:
          type: string
        example: 192.168.1.1/24
      - name: client_app_types
        in: query
        description: A comma separated list of client application types
        schema:
          type: string
        example: Browser
      - name: client_apps
        in: query
        description: A comma separated list of client application IDs.
        schema:
          type: string
        example: 3
      - name: parameters
        in: query
        description: A comma separated list of encoded parameters.
        schema:
          type: string
      - name: user_agents
        in: query
        description: A comma separated list of encoded user agents.
        schema:
          type: string
        example: Googlebot-2.1
      - name: exception_id_only
        in: query
        description: Return only the new/edited exception id.
        schema:
          type: string
        example: true
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: res - contains the specific error code:<br/>2 - Invalid input.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiResultSiteStatus'
                - $ref: '#/components/schemas/ApiResult'
  /api/prov/v1/sites/configure:
    post:
      tags:
      - Site Management
      summary: Modify site configuration
      description: Use this operation to change one of the basic configuration settings
        of the site.
      operationId: modifySiteConfiguration
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on
        required: true
        schema:
          type: string
        example: example.imperva.com
      - name: param
        in: query
        description: "Name of configuration parameter to set.<br/>Parameter values:<br/><ul><li><b>active</b>\
          \ Whether the site is active or bypassed by the Imperva network. One of:\
          \ active | bypass.</li><li><b>site_ip</b> Comma separated list of IPs. For\
          \ example: 8.8.8.8,1.2.2.2</li><li><b>domain_validation</b> Sets the domain\
          \ validation method that will be used to generate an SSL certificate. One\
          \ of: email | html | dns | cname<br/><b>One-step onboarding:</b> After adding\
          \ a site and configuring your traffic to point to Imperva, use the html\
          \ option to automatically add SSL support. Certificate creation takes approximately\
          \ 5 minutes. During this time no traffic will reach the origin server.<br/><b>Note</b>:\
          \ When running domain validation on a site, you may see the following error\
          \ message in the API response: Internal error - \"Add site operation hasn't\
          \ finished\".<br/>After running the add site process, it may take several\
          \ minutes for the database to finish updating. During this time, attempts\
          \ to further configure the site are blocked.<br/>In some cases, the database\
          \ is not updated even after the add site process is complete.<br/>If the\
          \ issue does not resolve after a few minutes, contact Support.</li><li><b>approver</b>\
          \ Sets the approver e-mail address that will be used to perform SSL domain\
          \ validation.</li><li><b>ignore_ssl</b> Sets the ignore SSL flag (if the\
          \ site is in pending-select-approver state). Pass \"true\" in the value\
          \ parameter.</li><li><b>acceleration_level</b> Sets the acceleration level\
          \ of the site, one of: none | standard | aggressive. It is advised to use\
          \ the newer Modify caching mode API call instead, as it provides enhanced\
          \ functionality.</li><li><b>seal_location</b> Sets the seal location, e.g.\
          \ \"api.seal_location.bottom_right\".</li><li><b>domain_redirect_to_full</b>\
          \ Sets the redirect naked to full flag. Pass \"true\" in the value parameter.</li><li><b>remove_ssl</b>\
          \ Sets the remove SSL from site flag. Pass \"true\" in the value parameter.</li><li><b>ref_id</b>\
          \ Sets the Reference ID, a free-text field that enables you to add a unique\
          \ identifier to correlate an object in our service, such as a protected\
          \ website, with an object on the customer side.</li><li><b>naked_domain_san</b>\
          \ Use this option to determine if the naked domain SAN will be added to\
          \ the SSL certificate for www site. Will take effect in the next renewal.</li><li><b>wildcard_san</b>\
          \ Use this option to determine if the wildcard SAN or the full domain SAN\
          \ is added to the Imperva SSL certificate for site. Will take effect in\
          \ the next renewal.</li><li><b>set_cookies_without_domain</b> Use this option\
          \ to determine if to set site cookies without domain.</li><li><b>restricted_cname_reuse</b>\
          \ Use this option to determine if legitimate traffic for all verified domains\
          \ in the table is automatically allowed.</li><li><b>request_body_timeouts</b>\
          \ Use this option to override default mitigation settings for slow HTTP\
          \ attacks.</li><b>Note</b>: Send value in the format of {\u201Cmethods\u201D\
          : [method name,method name,\u2026],\u201Cinterval\u201D: integer,\u201C\
          byteCount\u201D: integer}. For example: {\u201Cmethods\u201D: [HTTP_POST,\
          \ HTTP_GET],\u201Cinterval\u201D:30,\u201CbyteCount\u201D:20}. Each post\
          \ of the API overwrites the custom configuration. To delete the whole custom\
          \ configuration, send {} as the value. Possible values for method: HTTP_POST,\
          \ HTTP_GET, HTTP_PUT, HTTP_RPC_IN_DATA, HTTP_RPC_OUT_DATA</ul>"
        required: true
        schema:
          type: string
        example: active
      - name: value
        in: query
        description: According to the param value.
        required: true
        schema:
          type: string
        example: bypass
      responses:
        '200':
          description: res - contains the specific error code:<br/>3015 - Internal
            error<br/>6001 - Invalid configuration parameter name<br/>6002 - Invalid
            configuration parameter value<br/>1 - Unexpected error<br/>9414 - Feature
            not permitted
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiResultSiteStatus'
                - $ref: '#/components/schemas/ApiResult'
  /api/prov/v1/sites/setlog:
    post:
      tags:
      - Site Management
      summary: Modify site logs level
      description: Use this operation to change the site log configuration.
      operationId: modifySiteLogLevel
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on
        required: true
        schema:
          type: string
        example: 10
      - name: log_level
        in: query
        description: 'Available only for customers that purchased the Logs Integration
          SKU. Sets the log reporting level for the site.<br/>Possible values: full,
          security, none, default'
        required: true
        schema:
          type: string
        example: full
      - name: logs_account_id
        in: query
        description: Available only for customers that purchased the Logs Integration
          SKU. Numeric identifier of the account that purchased the logs integration
          SKU and which collects the logs.<br/>If not specified, operation will be
          performed on the account identified by the authentication parameters
        schema:
          type: string
        example: 10
      responses:
        '200':
          description: res - contains the specific error code:<br/>2 - Invalid input<br/>6002
            - Invalid configuration parameter name<br/>6001 - Invalid configuration
            parameter name<br/>9415 - Operation not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
  /api/prov/v1/sites/configure/security:
    post:
      tags:
      - Site Management
      summary: Modify site security configuration
      description: Use this operation to change the security configuration of a site.
        To modify the configuration for a specific rule, additional parameters may
        be required, as documented below.
      operationId: modifySiteSecurityConfiguration
      parameters:
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on
        required: true
        schema:
          type: string
        example: 15
      - name: rule_id
        in: query
        description: ID of the security rule to change.<br/>Values for the rule_id
          parameter:<br/><ul><li>api.threats.bot_access_control</li><li>api.threats.sql_injection</li><li>api.threats.cross_site_scripting</li><li>api.threats.backdoor</li><li>api.threats.ddos</li><li>api.threats.remote_file_inclusion</li></ul>
        required: true
        schema:
          type: string
        example: 578942
      - name: block_bad_bots
        in: query
        description: 'Whether or not to block bad bots. Possible values: true, false'
        schema:
          type: string
        example: true
      - name: challenge_suspected_bots
        in: query
        description: 'Whether or not to send a challenge to clients that are suspected
          to be bad bots (CAPTCHA for example). Possible values: true, false'
        schema:
          type: string
        example: true
      - name: activation_mode
        in: query
        description: 'Possible values: api.threats.ddos.activation_mode.off, api.threats.ddos.activation_mode.auto,
          api.threats.ddos.activation_mode.on, api.threats.ddos.activation_mode.adaptive<br/><ul><li><b>api.threats.ddos.activation_mode.off</b>
          Security measures are disabled even if site is under a DDoS attack</li><li><b>api.threats.ddos.activation_mode.auto</b>
          Security measures will be activated automatically when the system suspects
          site is under a DDoS attack</li><li><b>api.threats.ddos.activation_mode.on</b>
          Security measures are enabled even if site is not under a DDoS attack</li><li><b>api.threats.ddos.activation_mode.adaptive</b>
          Security measures are enabled with an adaptive threshold based on the website''s
          traffic</li></ul>The syntax is as follows:<rule_id>.activation_mode.<value>
          For example, for ''off'', use ''activation_mode=api.threats.ddos.activation_mode.off.<br/><b>Note:</b>
          This parameter is relevant and required for a DDoS rule only -- where rule_id=api.threats.ddos.'
        schema:
          type: string
        example: api.threats.ddos.activation_mode.off
      - name: security_rule_action
        in: query
        description: The action that should be taken when a threat is detected, for
          example:<br/>api.threats.action.block_ip. Different actions are allowed
          per different threats, e.g. backdoors may only be quarantined, ignored,
          or trigger an alert.<br/>Values for the security_rule_action parameter:<br/><ul><li><b>api.threats.action.disabled</b>
          Threat is not blocked, site owner is not notified.</li><li><b>api.threats.action.alert</b>
          Threat is not blocked, site owner is notified.</li><li><b>api.threats.action.block_request</b>
          Threat blocked by stopping the request, site owner is notified.</li><li><b>api.threats.action.block_user</b>
          Threat blocked by stopping the request. Additional requests by the client
          application will be automatically blocked for a duration of several minutes.
          Site owner is notified.</li><li><b>api.threats.action.block_ip</b> Threat
          blocked by stopping the request. Additional requests from the same IP addresses
          will be automatically blocked for a duration of several minutes. Site owner
          is notified.</li><li><b>api.threats.action.quarantine_url</b> Relevant only
          for Backdoor Protect. When detecting a backdoor, additional requests to
          the URL of the backdoor will be automatically blocked. Site owner is notified.</li></ul>
        schema:
          type: string
        example: api.threats.action.alert
      - name: quarantined_urls
        in: query
        description: 'Removes quarantined URLs from the backdoor protection list,
          as defined in the Cloud Security Console Website Settings > WAF Settings
          > Backdoor Protect.<br/>To remove a URL from the backdoor protection list,
          use the following parameters with the specified values:<br/>quarantined_urls:
          <URL full path><br/>rule_id: api.threats.backdoor<br/>security_rule_action:
          api.threats.action.quarantine_url'
        schema:
          type: string
        example: www.example.com
      - name: ddos_traffic_threshold
        in: query
        description: Consider site to be under DDoS if the request rate is above this
          threshold.<br/><b>Allowed values:</b> 10-10000 requests per second.
        schema:
          type: integer
          format: int64
        example: 1500
      - name: unknown_clients_challenge
        in: query
        description: 'Defines a method used for challenging suspicious bots. Possible
          values: none, cookies, javascript, captcha. This parameter is relevant for
          a DDoS rule only.'
        schema:
          type: string
        example: none
      - name: block_non_essential_bots
        in: query
        description: 'If non-essential bots should be blocked or not. Possible values:
          true, false. This parameter is relevant for a DDoS rule only.'
        schema:
          type: string
        example: true
      responses:
        '200':
          description: res - contains the specific error code:<br/>9414 - Feature
            not permitted<br/>9415 - Operation not allowed<br/>2 - Invalid input
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiResultSiteStatus'
                - $ref: '#/components/schemas/ApiResult'
  /api/prov/v1/sites/tls:
