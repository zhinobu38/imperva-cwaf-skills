  /api/stats/v1:
    post:
      tags:
      - Traffic Statistics and Logs
      summary: Get statistics
      description: Get site statistics for one or more sites. This operation may return
        multiple statistics, as specified in the stats parameter.
      operationId: getStats
      parameters:
      - name: account_id
        in: query
        description: 'Numeric identifier of the account to fetch data for.<br/>Note:
          You must specify either account_id or site_id.'
        schema:
          type: string
        example: 10
      - name: time_range
        in: query
        description: 'Time range to fetch data for.<br/>Some operations require the
          user to specify a time range. This is done via the time_range parameter,
          which accepts the following values:<br/><ul><li><b>today</b> Retrieve data
          from midnight today until the current time.</li><li><b>last_7_days</b> Retrieve
          data from midnight of 7 days ago until the current time.</li><li><b>last_30_days</b>
          Retrieve data from midnight of 30 days ago until the current time.</li><li><b>last_90_days</b>
          Retrieve data from midnight of 90 days ago until the current time.</li><li><b>month_to_date</b>
          Retrieve data from midnight of the first day of the month until the current
          time.</li><li><b>custom</b> Specify a custom time range using two additional
          parameters: start and end.<br/>Results are provided for full days only,
          starting from midnight. A time range of less than 24 hours gives results
          for the full day.<br/>For example:<ul><li>A time range of 14:00 - 20:00
          yesterday gives results for all of yesterday (midnight to midnight) - a
          full day.</li><li>A time range of 14:00 last Tuesday to 14:00 last Wednesday
          gives results for all of Tuesday and Wednesday - two full days.</li> <li>A
          time range of 14:00 yesterday to 14:00 today gives results for all of yesterday
          starting from midnight until the current time today.</li></ul></li></ul>'
        required: true
        schema:
          type: string
        example: last_7_days
      - name: start
        in: query
        description: Start date in milliseconds since January 1, 1970 (midnight UTC/GMT).
          Used together with the time_range parameter to specify a custom time range.
        schema:
          type: string
        example: 1610356734
      - name: end
        in: query
        description: End date in milliseconds since January 1, 1970 (midnight UTC/GMT).
          Used together with the time_range parameter to specify a custom time range.
        schema:
          type: string
        example: 1610356734
      - name: site_id
        in: query
        description: 'Numeric identifier of the site to fetch data for. Multiple sites
          can be specified in a comma separated list. For example: 123,124,125.<br/>Note:
          You must specify either account_id or site_id.'
        schema:
          type: string
        example: 123
      - name: stats
        in: query
        description: Statistics to fetch, as specified in the table below. Multiple
          statistics can be specified in a comma separated list.<br/>Values for the
          stats parameters:<br/><ul><li><b>visits_timeseries</b> Number of sessions
          by type (Humans/Bots) over time.</li><li><b>hits_timeseries</b> Number of
          requests by type (Humans/Bots/Blocked) over time and per second.</li><li><b>bandwidth_timeseries</b>
          Amount of bytes (bandwidth) and bits per second (throughput) transferred
          via the Imperva network from clients to proxy servers and vice-versa over
          time.</li><li><b>requests_geo_dist_summary</b> Total number of requests
          routed via the Imperva network by data center location.</li><li><b>visits_dist_summary</b>
          Total number of sessions per client application and country.</li><li><b>caching</b>
          Total number of requests and bytes that were cached by the Imperva network.</li><li><b>caching_timeseries</b>
          Number of requests and bytes that were cached by the Imperva network, with
          one day resolution, with info regarding the caching mode (standard or advanced).</li><li><b>threats</b>
          Total number of threats by type with additional information regarding the
          security rules configuration.</li><li><b>incap_rules</b> List of security
          rules with total number of reported incidents for each rule.</li><li><b>incap_rules_timeseries</b>
          List of security rules with a series of reported incidents for each rule
          with the specified granularity.</li><li><b>delivery_rules</b> List of delivery
          rules with total number of hits for each rule.</li><li><b>delivery_rules_timeseries</b>
          List of delivery rules with a series of hits for each rule with the specified
          granularity.</li></ul>
        required: true
        schema:
          type: string
        example: threats
      - name: granularity
        in: query
        description: 'Time interval in milliseconds between data points for time series
          statistics. (See the timeseries values in the table below.)<br/>The default
          granularity depends on the specified time range, as follows:<br/><ul><li>Time
          range of less than 24 hours: Default granularity is 7200000 (2 hours).</li><li>Time
          range of between 24 hours and 30 days: Default granularity is 86400000 (1
          day).</li><li>Time range of more than 30 days: Default granularity is 259200000
          (3 days).</li></ul>The response includes one result for each interval. For
          example, if you specify a time range value of last_7_days, the default granularity
          is 1 day, and the response will return 7 results.<br/>The response timestamps
          are in milliseconds since January 1, 1970 (midnight UTC/GMT)<br/>Minimum
          granularity is 5 minutes (300000).<br/>Note: Time series statistics are
          presented oldest to newest.<br/>'
        schema:
          type: string
        example: 7200000
      responses:
        '200':
          description: res - contains the specific error code:<br/> 13001 (Timerange
            invalid), 13002 (Granularity invalid)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiResultSiteStats'
                - $ref: '#/components/schemas/ApiResult'
