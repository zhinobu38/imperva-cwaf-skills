    DataCentersConfiguration:
      type: object
      properties:
        lbAlgorithm:
          type: string
          description: Specifies how to load balance between multiple data centers
          example: GEO_PREFERRED
          default: BEST_CONNECTION_TIME
          enum:
          - BEST_CONNECTION_TIME
          - GEO_PREFERRED
          - GEO_REQUIRED
          - WEIGHTED_LB
        failOverRequiredMonitors:
          type: string
          description: How many Imperva PoPs should assess Data Center as down before
            failover is performed.MANY means more than one. MOST means more than 50%.
          example: MANY
          default: MOST
          enum:
          - ONE
          - MANY
          - MOST
          - ALL
        dataCenterMode:
          type: string
          description: SINGLE_SERVER does not allow load balancing. SINGLE_DC allows
            load balancing and/or failover between its servers. MULTIPLE_DC allows
            load balancing and/or failover between the data centers plus geo aware
            routing.
          example: MULTIPLE_DC
          default: SINGLE_DC
          enum:
          - SINGLE_SERVER
          - SINGLE_DC
          - MULTIPLE_DC
        minAvailableServersForDataCenterUp:
          minimum: 1
          type: integer
          description: The minimal number of available data center's servers to consider
            that data center as UP
          format: int32
          example: 3
          default: 1
        kickStartURL:
          type: string
          description: The URL that will be sent to the standby server when Imperva
            performs failover based on our monitoring. Port must be specified, if
            protocol is https.
          example: https://www.example.com:443/kickStart
        kickStartUser:
          type: string
          description: The kickstart user, if kickstart URL is protected by user and
            password
          example: kickstart-user
        kickStartPass:
          type: string
          description: The kickstart password, if kickstart URL is protected by user
            and password
          example: kickstart-pass
        isPersistent:
          type: boolean
          description: When true our proxy servers will maintain session stickiness
            to origin servers by a cookie
          example: false
          default: true
