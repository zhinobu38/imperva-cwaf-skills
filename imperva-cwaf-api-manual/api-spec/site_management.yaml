  /api/prov/v1/sites/incapRules/add:
    post:
      tags:
      - Site Management
      summary: Add rule
      description: Use this operation to add a rule (Delivery, Security or Rate).
      operationId: addCustomRule
      parameters:
      - name: action
        in: query
        description: "Rule action. See the possible values in the table below.<br/>Possible\
          \ action parameter values for Delivery Rules:<br/><ul><li><b>RULE_ACTION_REDIRECT</b>\
          \ Redirect the client to a different URL, responding with a 30X response.</li><li><b>RULE_ACTION_SIMPLIFIED_REDIRECT</b>\
          \ Redirect the client to a different URL, responding with a 30X response.</li><li><b>RULE_ACTION_REWRITE_URL</b>\
          \ Modify the path to which a specific request is targeted.</li><li><b>RULE_ACTION_REWRITE_HEADER</b>\
          \ Modify or add a request header before passing traffic to the origin server.</li><li><b>RULE_ACTION_REWRITE_COOKIE</b>\
          \ Modify or add cookies that are sent by the client to the origin server.\
          \ The cookie name and value should be indicated.</li><li><b>RULE_ACTION_DELETE_HEADER</b>\
          \ Remove a specific request header, which means that it won\u2019t be sent\
          \ to the origin server.</li><li><b>RULE_ACTION_DELETE_COOKIE</b> Remove\
          \ a specific cookie set on the client, which means that it won\u2019t be\
          \ sent to the origin server.</li><li><b>RULE_ACTION_FORWARD_TO_DC</b> Define\
          \ the data center to which a specific request will be sent.</li><li><b>RULE_ACTION_FORWARD_TO_PORT</b>\
          \ Define the port to which a specific request will be sent.</li><li><b>RULE_ACTION_RESPONSE_REWRITE_HEADER</b>\
          \ Modify or add a header to the response received from the origin server.</li><li><b>RULE_ACTION_RESPONSE_DELETE_HEADER</b>\
          \ Remove a specific response header, which means that it won't be returned\
          \ to the client.</li><li><b>RULE_ACTION_RESPONSE_REWRITE_RESPONSE_CODE</b>\
          \ Modify the response code received from the origin server.</li></ul><br/>Possible\
          \ action parameter values for security rules:<br/><ul><li><b>RULE_ACTION_ALERT</b>\
          \ Generate a non blocking alert for this event.</li><li><b>RULE_ACTION_BLOCK</b>\
          \ Block the current request and generate an alert for this event.</li><li><b>RULE_ACTION_BLOCK_USER</b>\
          \ Block the current session and generate an alert for this event. Any subsequent\
          \ request from the same Session will be blocked.</li><li><b>RULE_ACTION_BLOCK_IP</b>\
          \ Block the current session and generate an alert for this event. Any subsequent\
          \ request from the same Session will be blocked.</li><li><b>RULE_ACTION_RETRY</b>\
          \ Require any client matching the rule filters to support cookies in order\
          \ to complete the request.</li><li><b>RULE_ACTION_INTRUSIVE_HTML</b> Require\
          \ any client matching the rule filters to support javascript in order to\
          \ complete the request. Since the Javascript test is embedded in an HTML\
          \ page, this action should only be enabled for HTML resources.</li><li><b>RULE_ACTION_CAPTCHA</b>\
          \ Require any client matching the rule filters to pass a CAPTCHA test in\
          \ order to complete the request. Since the CAPTCHA test is embedded in an\
          \ HTML page, this action should only be enabled for HTML resources.</li></ul><br/>Possible\
          \ action parameter values for counter (rate) rules:<br/><ul><li><b>RULE_ACTION_RATE</b>\
          \ Count the number of requests received that match the rule filter.</li></ul>"
        required: true
        schema:
          type: string
        example: RULE_ACTION_EXCLUDE
      - name: site_id
        in: query
        description: Numeric identifier of the site to operate on.
        required: true
        schema:
          type: integer
          format: int64
        example: 10
      - name: name
        in: query
        description: Rule name.
        required: true
        schema:
          type: string
        example: rule1
      - name: filter
        in: query
        description: Rule will trigger only a request that matches this filter. For
          more details on filter guidelines, see <a href="https://docs.imperva.com/csh?context=rule_syntax">Syntax
          Guide</a>.<br/>The filter may contain up to 400 characters.
        required: true
        schema:
          type: string
        example: ==
      - name: response_code
        in: query
        description: Redirect rule's response code. Valid values are 302, 301, 303,
          307, 308.
        schema:
          type: integer
          format: int32
        example: 1
      - name: protocol
        in: query
        schema:
          type: string
        example: 10
      - name: add_missing
        in: query
        description: Add cookie or header if it doesn't exist (Rewrite cookie rule
          only)
        schema:
          type: boolean
        example: true
      - name: from
        in: query
        description: The pattern to rewrite.<br/>For RULE_ACTION_REWRITE_URL - The
          URL to rewrite.<br/>For RULE_ACTION_REWRITE_HEADER - The header value to
          rewrite.<br/>For RULE_ACTION_REWRITE_COOKIE - The cookie value to rewrite.<br/>For
          RULE_ACTION_SIMPLIFIED_REDIRECT - Redirect the client to a different URL,
          responding with a 30X response.
        schema:
          type: string
        example: /home.php
      - name: to
        in: query
        description: The pattern to change to.<br/>For RULE_ACTION_REWRITE_URL - The
          URL to change to.<br/>For RULE_ACTION_REWRITE_HEADER - The header value
          to change to.<br/>For RULE_ACTION_REWRITE_COOKIE - The cookie value to change
          to.<br/>For RULE_ACTION_SIMPLIFIED_REDIRECT - Redirect the client to a different
          URL, responding with a 30X response.
        schema:
          type: string
        example: '*/home.html'
      - name: rewrite_name
        in: query
        description: Name of cookie or header to rewrite. Applies only for RULE_ACTION_REWRITE_COOKIE
          and RULE_ACTION_REWRITE_HEADER.
        schema:
          type: string
        example: rule2
      - name: dc_id
        in: query
        description: Data center to forward request to. Applies only for RULE_ACTION_FORWARD_TO_DC.
        schema:
          type: integer
          format: int64
        example: 54313
      - name: allow_caching
        in: query
        schema:
          type: boolean
        example: true
      - name: is_test_mode
        in: query
        description: Apply the rule only to the IP address the API request was sent
          from.<br/>This option is not available for Simplified Redirect rules.
        schema:
          type: boolean
        example: true
      - name: rate_context
        in: query
        description: 'The context of the rate counter. Possible values: IP / Session.
          Applies only to rules using RULE_ACTION_RATE.'
        schema:
          type: string
        example: Session
      - name: rate_interval
        in: query
        description: 'The interval (in seconds) of the rate counter. Possible values:
          A multiple of 10 from 10-300. Applies only to rules using RULE_ACTION_RATE.'
        schema:
          type: integer
          format: int32
        example: 10
      - name: port_forwarding_context
        in: query
        description: Context for port forwarding. "Use Port Value" or "Use Header
          Name". Applies only for RULE_ACTION_FORWARD_TO_PORT.
        schema:
          type: string
      - name: port_forwarding_value
        in: query
        description: Port number or header name for port forwarding. Applies only
          for RULE_ACTION_FORWARD_TO_PORT.
        schema:
          type: string
        example: 20
      - name: multiple_deletions
        in: query
        description: Delete multiple header occurrences. Applies only to rules using
          RULE_ACTION_DELETE_HEADER and RULE_ACTION_RESPONSE_DELETE_HEADER.
        schema:
          type: boolean
        example: true
      - name: rewrite_existing
        in: query
        description: Rewrite cookie or header if it exists
        schema:
          type: boolean
        example: true
      responses:
        '200':
          description: res - contains the specific error code:<br/>2 - Invalid input,
            3015 - Granularity invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRuleResponse'
