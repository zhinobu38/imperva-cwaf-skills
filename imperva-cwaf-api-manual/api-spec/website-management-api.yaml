openapi: 3.0.1
info:
  description: Get details of your websites configured in Imperva.
  license:
    name: The terms in the absence of an applicable signed agreement between you and
      Imperva
    url: https://www.imperva.com/legal/license-agreement/
  title: Sites management API Documentation
  version: 1.0.0
servers:
  - url: https://api.imperva.com/sites-mgmt
    description: Imperva API server
security:
  - api_id: []
    api_key: []
tags:
  - description: Manage site SPA settings. To enable SPA for your account, contact
      <a href="https://support.imperva.com" target="_blank"> Support </a> or
      your customer success representative.
    name: SPA API
paths:
  /v3/accounts/settings/default-tls-configuration:
    get:
      description: Get account default TLS configuration settings by account ID.
      operationId: getAccountDefaultInboundTLSConfiguration
      parameters:
        - description: The Imperva ID of the account or subaccount. By default, the
            account ID is the ID associated with the API credentials used for
            authentication. To run an API on a sub account, specify the sub
            account ID.
          in: query
          name: caid
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          content:
            application/json:
              examples:
                InboundTlsSettingsDto:
                  description: InboundTlsSettingsDto
                  value:
                    data:
                      - configurationProfile: CUSTOM
                        tlsConfiguration:
                          - tlsVersion: TLS_1_3
                            ciphersSupport:
                              - TLS_AES_128_GCM_SHA256
                              - TLS_CHACHA20_POLY1305_SHA256
              schema:
                $ref: "#/components/schemas/AccountInboundTLSConfigurationRequest"
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Error
      summary: Get account default TLS configuration settings.
      tags:
        - Account TLS configuration
    put:
      description: Update the account default TLS configuration. This configuration
        will be applied to new websites created directly under the specified
        account.
      operationId: setAccountDefaultInboundTLSConfiguration
      parameters:
        - description: The Imperva ID of the account or subaccount. By default, the
            account ID is the ID associated with the API credentials used for
            authentication. To run an API on a sub account, specify the sub
            account ID.
          in: query
          name: caid
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            examples:
              SPA:
                description: Sets custom ciphers profile with support for just TLS v1.3 and
                  specific list of ciphers.
                value:
                  data:
                    - configurationProfile: CUSTOM
                      tlsConfiguration:
                        - tlsVersion: TLS_1_3
                          ciphersSupport:
                            - TLS_AES_128_GCM_SHA256
                            - TLS_CHACHA20_POLY1305_SHA256
            schema:
              $ref: "#/components/schemas/AccountInboundTLSConfigurationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                SPA:
                  description: SPA
                  value:
                    data:
                      - configurationProfile: CUSTOM
                        tlsConfiguration:
                          - tlsVersion: TLS_1_3
                            ciphersSupport:
                              - TLS_AES_128_GCM_SHA256
                              - TLS_CHACHA20_POLY1305_SHA256
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Error
      summary: Define account default TLS configuration settings.
      tags:
        - Account TLS configuration
  /v3/sites:
    get:
      description: Retrieve details of all websites associated with the current
        account. <br />To filter for a subset of the account’s websites, provide
        website IDs and website names. <br />If multiple filters are provided,
        an AND operation is applied and the API will return all websites
        matching the filters.
      operationId: getSites
      parameters:
        - description: A list of website ids. If this parameter is provided, only websites
            matching one of these IDs will be returned.
          in: query
          name: siteIds
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - description: A list of website names. If this parameter is provided, only
            websites matching one of these names will be returned.
          in: query
          name: names
          required: false
          schema:
            type: array
            items:
              type: string
        - description: A list of website types. Indicates if the website is onboarded to
            Imperva Cloud WAF or configured for Imperva WAF Anywhere. If this
            parameter is provided, only websites with type matching one of these
            types will be returned.
          in: query
          name: siteTypes
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - CLOUD_WAF
                - LOCAL
                - PUBLIC_CLOUD
        - description: A list of sub account IDs. When provided, the API returns websites
            corresponding to the specified sub account IDs. This parameter is
            ignored if the API call is authenticated as a sub account.
          in: query
          name: subAccIds
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - description: The page to return starting from 0.
          in: query
          name: page
          required: false
          schema:
            minimum: 0
            type: integer
            format: int32
            default: 0
        - description: Page size used to determine the first object to be returned and the
            number of objects to be returned.
          in: query
          name: size
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - description: The Imperva ID of the account or subaccount. By default, the
            account ID is the ID associated with the API credentials used for
            authentication. To run an API on a sub account, specify the sub
            account ID.
          in: query
          name: caid
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCollectionSite"
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Error
      summary: Get sites
      tags:
        - Site Management
    post:
      description: Create site associated with the current account
      operationId: postSite
      parameters:
        - description: The Imperva ID of the account or subaccount. By default, the
            account ID is the ID associated with the API credentials used for
            authentication. To run an API on a sub account, specify the sub
            account ID.
          in: query
          name: caid
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Site"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionSite"
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Error
      summary: Create site
      tags:
        - Site Management
