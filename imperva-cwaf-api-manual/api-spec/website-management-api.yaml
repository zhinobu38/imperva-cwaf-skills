  /v3/sites/onboard:
    post:
      description: "Quickly onboard a website with a single API call.</br></br>If the
        specified domain is configured in DNS to point to your website’s
        servers, Imperva automatically identifies the origin servers and
        associates them with the new site. If the specified domain is not
        configured in your DNS, you must provide the site’s origin server
        addresses using the servers parameter. The created website automatically
        receives SSL coverage served by an Imperva-managed certificate dedicated
        to this site.</br></br>The API response includes all the REST entities
        that are created during the onboarding process (site, domains, servers,
        and certificate settings). The response also includes instructions
        comprised of 2 parts: SSL and Network.</br></br>The SSL instructions
        describe how to configure your DNS in order to complete the domain
        ownership validation process. By default, domain ownership validation is
        done using a CNAME record.</br></br>The Network section provides
        instructions on how to direct your domain’s traffic to the Imperva
        network."
      operationId: postSiteController
      parameters:
        - description: The Imperva ID of the account or subaccount. By default, the
            account ID is the ID associated with the API credentials used for
            authentication. To run an API on a sub account, specify the sub
            account ID.
          in: query
          name: caid
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteOnboardingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionSiteOnboardResponse"
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Error
      summary: Simplified site onboarding
      tags:
        - Simplified Site Onboarding
  /v3/sites/spa/{siteId}:
    get:
      description: Retrieves the SPA settings for a given website.
      operationId: getSiteSpaSettings
      parameters:
        - description: The Imperva site ID of your website.
          in: path
          name: siteId
          required: true
          schema:
            type: integer
            format: int64
        - description: The Imperva ID of the account or subaccount. By default, the
            account ID is the ID associated with the API credentials used for
            authentication. To run an API on a sub account, specify the sub
            account ID.
          in: query
          name: caid
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/SiteSpaSettingsApiResponse"
          description: Successful operation
        "400":
          content:
            "*/*":
              examples:
                Bad Request:
                  description: Bad Request
                  value:
                    errors:
                      - status: 400
                        id: null
                        source:
                          pointer: /v3/sites/16612920 /settings/spa
                        title: Bad Request
                        detail: "Failed to get site spa info. Message: Bad Request"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            "*/*":
              examples:
                Unauthorized:
                  description: Unauthorized
                  value:
                    errors:
                      - status: 401
                        id: ba34a964fe9a1887
                        source:
                          pointer: /v3/sites/16612920/settings/spa
                        title: Unauthorized
                        detail: Failed to verify permissions
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            "*/*":
              examples:
                Not Found:
                  description: Not Found
                  value:
                    errors:
                      - status: 404
                        id: null
                        source:
                          pointer: /v3/sites/16/settings/spa
                        title: Not Found
                        detail: "Failed to get site spa info. Message: Not Found"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "500":
          content:
            "*/*":
              examples:
                Internal Server Error:
                  description: Internal Server Error
                  value:
                    errors:
                      - status: 500
                        id: 1dce2fbdec3e60e2
                        source:
                          pointer: /v3/sites/16612922/settings/spa
                        title: Internal Server Error
                        detail: Internal Server Error
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Get site SPA settings
      tags:
        - SPA API
    put:
      description: Updates the SPA settings for a given website.
      operationId: modifySiteSpaSettings
      parameters:
        - description: The Imperva site ID of your website.
          in: path
          name: siteId
          required: true
          schema:
            type: integer
            format: int64
        - description: The Imperva ID of the account or subaccount. By default, the
            account ID is the ID associated with the API credentials used for
            authentication. To run an API on a sub account, specify the sub
            account ID.
          in: query
          name: caid
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            examples:
              SPA:
                description: Defines the whole site as a single-page application.
                value:
                  state: SPA
              SPA_FOR_SPECIFIC_URLS:
                description: SPA support applies only to the specific URLs specified in the
                  urlList.
                value:
                  state: SPA_FOR_SPECIFIC_URLS
                  urlList:
                    - /test1
                    - /test2
            schema:
              $ref: "#/components/schemas/SiteSpaSettingsDto"
        required: true
      responses:
        "200":
          content:
            "*/*":
              examples:
                SPA:
                  description: Defines the whole site as a single-page application.
                  value:
                    data:
                      - state: SPA
                SPA_FOR_SPECIFIC_URLS:
                  description: SPA support applies only to the specific URLs specified in the
                    urlList.
                  value:
                    data:
                      - state: SPA_FOR_SPECIFIC_URLS
                        urlList:
                          - /test1
                          - /test2
              schema:
                $ref: "#/components/schemas/SiteSpaSettingsApiResponse"
          description: Successful operation
        "400":
          content:
            "*/*":
              examples:
                Bad Request:
                  description: Bad Request
                  value:
                    errors:
                      - status: 400
                        id: null
                        source:
                          pointer: /v3/sites/16612920 /settings/spa
                        title: Bad Request
                        detail: "Failed to get site spa info. Message: Bad Request"
                NOT_SPA state with not empty url list:
                  description: NOT_SPA state with not empty url list
                  value:
                    errors:
                      - status: 400
                        id: 0949bee81d4bce3f
                        source:
                          pointer: /v3/sites/16612920/settings/spa
                        title: Bad Request
                        detail: Url list must be empty when site state is NOT_SPA
                Null state:
                  description: Null state
                  value:
                    errors:
                      - status: 400
                        id: 787d252e08cd99ad
                        source:
                          pointer: /v3/sites/16612920/settings/spa
                        title: Invalid Input Error
                        detail: state State must not be null!
                Null value for url:
                  description: Null value for url
                  value:
                    errors:
                      - status: 400
                        id: 358eebec0102e42c
                        source:
                          pointer: /v3/sites/16612920/settings/spa
                        title: Bad Request
                        detail: Invalid value for URL, expecting a not null string surrounded by quotes
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            "*/*":
              examples:
                Unauthorized:
                  description: Unauthorized
                  value:
                    errors:
                      - status: 401
                        id: ba34a964fe9a1887
                        source:
                          pointer: /v3/sites/16612920/settings/spa
                        title: Unauthorized
                        detail: Failed to verify permissions
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            "*/*":
              examples:
                Not Found:
                  description: Not Found
                  value:
                    errors:
                      - status: 404
                        id: null
                        source:
                          pointer: /v3/sites/16/settings/spa
                        title: Not Found
                        detail: "Failed to get site spa info. Message: Not Found"
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "500":
          content:
            "*/*":
              examples:
                Internal Server Error:
                  description: Internal Server Error
                  value:
                    errors:
                      - status: 500
                        id: 1dce2fbdec3e60e2
                        source:
                          pointer: /v3/sites/16612922/settings/spa
                        title: Internal Server Error
                        detail: Internal Server Error
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Update site SPA settings
      tags:
        - SPA API
