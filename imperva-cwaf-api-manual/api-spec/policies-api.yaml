          $ref: '#/components/schemas/GeoDto'
        ips:
          type: array
          items:
            type: string
        urls:
          type: array
          items:
            $ref: '#/components/schemas/UrlsDto'
    SimpleTextErrorResponse:
      type: object
      properties:
        isError:
          type: boolean
          description: States if an error has occurred
          example: true
        value:
          type: string
    UpdatePolicyDto:
      type: object
