  /api/prov/v3/sites/{extSiteId}/delivery-rules-configuration:
    get:
      tags:
      - Site Management
      summary: "Get site\u2019s delivery rule priority order for a specific rule category."
      description: Use this operation to list all delivery rules of a specific category.
        The rules are prioritized by order of appearance.
      operationId: listDeliveryRulesConfiguration
      parameters:
      - name: extSiteId
        in: path
        description: Numeric identifier of the site to operate on.
        required: true
        schema:
          type: integer
          format: int64
        example: 12345
      - name: category
        in: query
        description: 'Rules category. Possible values:<br>

          <b>REDIRECT</b> - Redirect requests with 30X response.<br>

          <b>SIMPLIFIED_REDIRECT</b> - Redirect requests with 30X response. (static
          redirect, doesn''t support condition)<br>

          <b>REWRITE</b> - Modify, add, and remove different request attributes such
          as URL, headers and cookies.<br>

          <b>REWRITE_RESPONSE</b> - Modify, add, and remove different response attributes
          such as headers, status code and error responses.<br>

          <b>FORWARD</b> - Forward the request to a specific data-center or port.'
        required: true
        schema:
          type: string
        example: REDIRECT
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Supported actions:<br/> <b>RULE_ACTION_REDIRECT</b> (RedirectRuleDTO):
                  summary: REDIRECT category
                  description: Supported actions:<br/> <b>RULE_ACTION_REDIRECT</b>
                    (RedirectRuleDTO)
                  value:
                    data:
                    - filter: ASN == 1
                      from: /1
                      to: /2
                      response_code: 302
                      rule_name: New delivery rule
                      action: RULE_ACTION_REDIRECT
                      enabled: true
                Supported actions:<br/> <b>RULE_ACTION_SIMPLIFIED_REDIRECT</b> (SimplifiedRedirectRuleDTO):
                  summary: SIMPLIFIED_REDIRECT category
                  description: Supported actions:<br/> <b>RULE_ACTION_SIMPLIFIED_REDIRECT</b>
                    (SimplifiedRedirectRuleDTO)
                  value:
                    data:
                    - from: /1
                      to: /2
                      response_code: 302
                      rule_name: New delivery rule
                      action: RULE_ACTION_REDIRECT
                      enabled: true
                ? Supported actions:<br/> <b>RULE_ACTION_REWRITE_COOKIE</b> (RewriteRequestCookieRuleDTO),<br/>
                  <b>RULE_ACTION_REWRITE_HEADER</b> (RewriteRequestHeaderRuleDTO),<br/>
                  <b>RULE_ACTION_REWRITE_URL</b> (RewriteRequestUrlRuleDTO),<br/>
                  <b>RULE_ACTION_DELETE_HEADER</b> (RewriteRequestDeleteHeaderRuleDTO),<br/>
                  <b>RULE_ACTION_DELETE_COOKIE</b> (RewriteRequestDeleteCookieRuleDTO)
                : summary: REWRITE category
                  description: Supported actions:<br/> <b>RULE_ACTION_REWRITE_COOKIE</b>
                    (RewriteRequestCookieRuleDTO),<br/> <b>RULE_ACTION_REWRITE_HEADER</b>
                    (RewriteRequestHeaderRuleDTO),<br/> <b>RULE_ACTION_REWRITE_URL</b>
                    (RewriteRequestUrlRuleDTO),<br/> <b>RULE_ACTION_DELETE_HEADER</b>
                    (RewriteRequestDeleteHeaderRuleDTO),<br/> <b>RULE_ACTION_DELETE_COOKIE</b>
                    (RewriteRequestDeleteCookieRuleDTO)
                  value:
                    data:
                    - filter: ASN == 1
                      from: cookie1
                      to: cookie2
                      cookie_name: abc
                      rewrite_existing: true
                      add_if_missing: false
                      rule_name: New delivery rule
                      action: RULE_ACTION_REWRITE_COOKIE
                      enabled: true
                    - filter: ASN == 1
                      from: header1
                      to: header2
                      header_name: abc
                      rewrite_existing: true
                      add_if_missing: false
                      rule_name: New delivery rule
                      action: RULE_ACTION_REWRITE_HEADER
                      enabled: true
                    - filter: ASN == 1
                      from: /1
                      to: /2
                      rule_name: New delivery rule
                      action: RULE_ACTION_REWRITE_URL
                      enabled: true
                    - filter: ASN == 1
                      header_name: abc
                      multiple_headers_deletion: false
                      rule_name: New delivery rule
                      action: RULE_ACTION_DELETE_HEADER
                      enabled: true
                    - filter: ASN == 1
                      cookie_name: abc
                      rule_name: New delivery rule
                      action: RULE_ACTION_DELETE_COOKIE
                      enabled: true
                ? Supported actions:<br/> <b>RULE_ACTION_RESPONSE_REWRITE_HEADER</b>
                  (RewriteResponseHeaderRuleDTO),<br/> <b>RULE_ACTION_RESPONSE_DELETE_HEADER</b>
                  (RewriteResponseDeleteHeaderRuleDTO),<br/> <b>RULE_ACTION_RESPONSE_REWRITE_RESPONSE_CODE</b>
                  (RewriteResponseCodeRuleDTO),<br/> <b>RULE_ACTION_CUSTOM_ERROR_RESPONSE</b>
                  (RewriteResponseCustomErrorRuleDTO)
                : summary: REWRITE_RESPONSE category
                  description: Supported actions:<br/> <b>RULE_ACTION_RESPONSE_REWRITE_HEADER</b>
                    (RewriteResponseHeaderRuleDTO),<br/> <b>RULE_ACTION_RESPONSE_DELETE_HEADER</b>
                    (RewriteResponseDeleteHeaderRuleDTO),<br/> <b>RULE_ACTION_RESPONSE_REWRITE_RESPONSE_CODE</b>
                    (RewriteResponseCodeRuleDTO),<br/> <b>RULE_ACTION_CUSTOM_ERROR_RESPONSE</b>
                    (RewriteResponseCustomErrorRuleDTO)
                  value:
                    data:
                    - filter: ASN == 1
                      header_name: abc
                      multiple_headers_deletion: false
                      rule_name: New delivery rule
                      action: RULE_ACTION_RESPONSE_DELETE_HEADER
                      enabled: true
                    - filter: ASN == 1
                      from: header1
                      to: header2
                      header_name: abc
                      rewrite_existing: true
                      add_if_missing: false
                      rule_name: New delivery rule
                      action: RULE_ACTION_RESPONSE_REWRITE_HEADER
                      enabled: true
                    - filter: ASN == 1
                      response_code: 302
                      rule_name: New delivery rule
                      action: RULE_ACTION_RESPONSE_REWRITE_RESPONSE_CODE
                      enabled: true
                    - filter: ASN == 1
                      error_response_format: '[JSON|XML]'
                      error_response_data: <?xml version="1.0" encoding="UTF-8"?>
                      error_type: error.type.all
                      response_code: 400
                      rule_name: New delivery rule
                      action: RULE_ACTION_CUSTOM_ERROR_RESPONSE
                      enabled: true
                ? Supported actions:<br/> <b>RULE_ACTION_FORWARD_TO_PORT</b> (ForwardToPortRuleDTO),<br/>
                  <b>RULE_ACTION_FORWARD_TO_DC</b> (ForwardToDcRuleDTO)
                : summary: FORWARD category
                  description: Supported actions:<br/> <b>RULE_ACTION_FORWARD_TO_PORT</b>
                    (ForwardToPortRuleDTO),<br/> <b>RULE_ACTION_FORWARD_TO_DC</b>
                    (ForwardToDcRuleDTO)
                  value:
                    data:
                    - filter: ASN == 1
                      dc_id: 1234
                      rule_name: New delivery rule
                      action: RULE_ACTION_FORWARD_TO_DC
                      enabled: true
                    - filter: ASN == 1
